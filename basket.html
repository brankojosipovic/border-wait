<html lang="sr">
<head>

<style>
  :root {
    color-scheme: dark;
    --bg: #0e1626; --panel: #16223a; --panel-2: #1b2a4a;
    --ink: #eef2f9; --ink-dim: #9fb0cc; --line: #283a5e;
    --gold: #c9a227; --good: #2e9e6b; --bad: #d65a4e;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f2f4f8; --panel: #ffffff; --panel-2: #eef1f7;
    --ink: #1b2a4a; --ink-dim: #5a6884; --line: #d7dded;
    --gold: #a9851a; --good: #1f7d52; --bad: #c0473c;
    --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Calibri, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  button { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; cursor: pointer;
    touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; }
  @media (hover: hover) { button:hover:not(:disabled) { border-color: var(--gold); } }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 6px;
          min-height: 100dvh; padding: 6px 10px 8px; }
  .col { width: min(100vw - 20px, 520px); }
  header { display: flex; align-items: center; gap: 10px;
           border-left: 4px solid var(--gold); padding: 3px 0 3px 10px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  header .sub { color: var(--ink-dim); font-size: 12px; }
  .spacer { flex: 1; }

  .traka { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-dim); white-space: nowrap; }
  .traka b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .traka .niz { color: var(--gold); font-weight: 700; }
  .traka .prot { overflow: hidden; text-overflow: ellipsis; }

  .stage { position: relative; }
  canvas { display: block; border: 1px solid var(--line); border-radius: 12px;
           background: #0b1220; box-shadow: var(--shadow); touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
             align-items: center; justify-content: center; text-align: center; padding: 16px;
             background: rgba(8,14,26,.93); backdrop-filter: blur(3px); border-radius: 12px; z-index: 5;
             color: #eef2f9; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; font-size: 13px; color: #9fb0cc; max-width: 320px; }
  .overlay .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .overlay button { background: #16223a; color: #eef2f9; border-color: #283a5e; }
  .overlay .izbor { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 280px; }
  .overlay .izbor button { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
  .overlay .izbor small { color: #9fb0cc; font-size: 11.5px; font-weight: 400; }
  .overlay .res { display: grid; grid-template-columns: auto auto; gap: 3px 14px; font-size: 14px; color: #9fb0cc; }
  .overlay .res b { color: #eef2f9; font-variant-numeric: tabular-nums; }
  .overlay .res span i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .overlay .mesta { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 280px;
                    font-size: 13.5px; color: #eef2f9; }
  .overlay .mesto { display: flex; align-items: center; gap: 7px; background: #16223a;
                    border: 1px solid #283a5e; border-radius: 9px; padding: 5px 9px; }
  .overlay .mesto i { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .overlay .mesto small { color: #9fb0cc; }
  .overlay .mesto.prazno { color: #9fb0cc; border-style: dashed; justify-content: center; font-size: 12.5px; }

  .akcije { display: flex; gap: 8px; }
  .akcije button { flex: 1; font-size: 14.5px; padding: 8px; }
  .akcije .glavno { border-color: var(--gold); color: var(--gold); font-weight: 700; }

  .foot { color: var(--ink-dim); font-size: 11px; line-height: 1.4; text-align: center; }
  .foot a { color: var(--ink-dim); }
  @media (max-height: 780px) { .foot { display: none; } }
  @media (max-height: 680px) { header .sub { display: none; } }
  @media (max-height: 600px) { header h1 { font-size: 15px; } .wrap { gap: 4px; } }
</style>

<body data-theme="dark">
<div class="wrap">
  <header class="col">
    <div>
      <h1>Basket</h1>
      <div class="sub">Slobodna bacanja — povuci prstom</div>
    </div>
    <div class="spacer"></div>
    <button id="theme" title="Svetla/tamna tema">☀︎ / ☾</button>
  </header>

  <div class="traka col">
    <span>Šut <b id="tSut">1</b>/<b id="tUkupno">10</b></span>
    <span>Koševi <b id="tPogoci">0</b></span>
    <span>Poeni <b id="tPoeni">0</b></span>
    <span class="niz" id="tNiz"></span>
    <span class="spacer"></span>
    <span class="prot" id="tProt"></span>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </div>

  <div class="akcije col">
    <button id="meniBtn2">☰ Meni</button>
    <button id="opetBtn2" class="glavno">↺ Nova serija</button>
  </div>

  <div class="foot col">
    Povuci prstom od lopte prema košu — koliko duže povučeš, jače ide. Čist koš (bez table i obruča) nosi 3 poena.
    <br><a href="igre.html">🎮 Sve igre</a> · <a href="pomoc.html">❔ Pomoć</a> · <a href="index.html">← Border Wait</a>
  </div>
</div>

<script src="igre.js"></script>
<script src="mreza.js"></script>
<script src="cet.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "basket.v1", THEME_KEY = "sudoku.theme";
const cv = $("#cv"), ctx = cv.getContext("2d");

/* ---------- teren, u metrima ----------
   Prave mere: obruč na 3,05 m, prečnik obruča 45 cm, tabla 15 cm iza obruča,
   linija slobodnog bacanja 4,6 m od table, lopta prečnika 24 cm. */
const OBRUC_Y = 3.05, R_OBRUCA = .022, R_LOPTE = .121;
const TABLA_X0 = 5.20, TABLA_D = 2.90, TABLA_G = 3.95;
const OD_TABLE_1 = .60, OD_TABLE_2 = .15;      // prednji i zadnji kraj obruča
const START = { x: .60, y: 1.55 };
const G_UBR = 9.81;
const SIRINA_SVETA = 6.4;
const KORAK = 1 / 300;                          // fizika ide sitnim koracima

const SERIJE = { 10: { nm: "10 lopti", opis: "kratka serija" }, 20: { nm: "20 lopti", opis: "prava serija" } };
const TEZINE = {
  lako:    { nm: "Lako",    opis: "miran koš, ceo luk se vidi unapred", vetar: 0,   pomera: 0,   pregled: 1.35 },
  srednje: { nm: "Srednje", opis: "miran koš, kratka pomoć",         vetar: 0,   pomera: 0,   pregled: .45 },
  tesko:   { nm: "Teško",   opis: "vetar i koš koji se pomera",      vetar: 2.6, pomera: .38, pregled: .22 }
};
const BOJE_IGRACA = ["#c9a227", "#d65a4e", "#3f8fd6", "#2e9e6b"];

/* ---------- stanje ---------- */
let P = null;              // serija: {ukupno, sut, pogoci, poeni, niz, najniz, tez, gotovo, istorija}
let lopta = null;          // {x, y, vx, vy, ug, vug, ...}
let faza = "meni";         // meni | cekam | leti | kraj
let vucem = null;          // {x0, y0, x, y}
let vetar = 0, kosT = 0, mrezaFaza = 0, tresi = 0;
let poruka = "", porukaDo = 0;
let rekordi = {};
let izbor = { serija: 10, tez: "srednje" };
let soba = null, cekaonica = false, ponoviVezu = null;
let raf = null, lastTs = 0, visak = 0;
let M = 1, POD = 0;        // metar u tačkama i visina poda na ekranu

const kosPomak = () => TEZINE[P ? P.tez : izbor.tez].pomera * Math.sin(kosT * 1.15);
const tablaX = () => TABLA_X0 + kosPomak();
const obrucX1 = () => tablaX() - OD_TABLE_1;
const obrucX2 = () => tablaX() - OD_TABLE_2;

function ucitaj() { try { rekordi = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { rekordi = {}; } }
function upisi() { try { localStorage.setItem(KEY, JSON.stringify(rekordi)); } catch (e) { } }
const kljucRek = () => (P ? P.ukupno + "-" + P.tez : izbor.serija + "-" + izbor.tez);
function upisiTok() {
  if (!P || P.gotovo || soba) return;
  try { localStorage.setItem(KEY + ".tok", JSON.stringify(P)); } catch (e) { }
}
function obrisiTok() { try { localStorage.removeItem(KEY + ".tok"); } catch (e) { } }
function ucitajTok() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY + ".tok") || "null");
    if (s && s.ukupno && !s.gotovo && s.sut < s.ukupno) return s;
  } catch (e) { }
  return null;
}

/* ---------- serija ---------- */
function novaSerija(ukupno, tez) {
  P = { ukupno, tez, sut: 0, pogoci: 0, poeni: 0, niz: 0, najniz: 0, gotovo: false, istorija: [] };
  izbor.serija = ukupno; izbor.tez = tez;
  rekordi.izbor = { serija: ukupno, tez }; upisi();
  hideOverlay();
  novaLopta();
  osveziTraku();
  javi("Povuci prstom prema košu", 1800);
}
function novaLopta() {
  lopta = { x: START.x, y: START.y, vx: 0, vy: 0, ug: 0, vug: 0,
    t: 0, tlo: 0, dodirObruc: false, dodirTabla: false, ubacena: false, gotova: 0 };
  vetar = TEZINE[P.tez].vetar ? (Math.random() * 2 - 1) * TEZINE[P.tez].vetar : 0;
  faza = "cekam"; vucem = null;
  osveziTraku();
}
function suti(vx, vy) {
  if (faza !== "cekam" || !lopta) return false;
  lopta.vx = vx; lopta.vy = vy;
  lopta.vug = -vx * .55 - 3.2;                  // bekspin, kao kod pravog šuta
  lopta.t = 0;
  faza = "leti";
  P.sut++;
  window.SFX && SFX.card();
  osveziTraku();
  return true;
}
function pogodak() {
  const cist = !lopta.dodirObruc && !lopta.dodirTabla;
  lopta.ubacena = true;
  P.pogoci++;
  P.niz++;
  P.najniz = Math.max(P.najniz, P.niz);
  const vatra = P.niz >= 3 ? 1 : 0;
  const poeni = (cist ? 3 : 2) + vatra;
  P.poeni += poeni;
  P.istorija.push(cist ? "c" : "k");
  mrezaFaza = 1;
  window.SFX && (cist ? SFX.mrezica() : SFX.coin());
  window.SFX && setTimeout(() => SFX.good(), 90);
  javi((cist ? "🎯 Čist koš! +" : "🏀 Koš! +") + poeni + (vatra ? " 🔥" : ""), 1400);
  osveziTraku();
  upisiTok();
}
function promasaj() {
  P.niz = 0;
  P.istorija.push("p");
  window.SFX && SFX.bad();
  javi("Promašaj", 900);
  osveziTraku();
  upisiTok();
}
function krajLopte() {
  if (!lopta.ubacena) promasaj();
  else upisiTok();
  if (soba) soba.posaljiRezultat();
  if (P.sut >= P.ukupno) return krajSerije();
  novaLopta();
}
function krajSerije() {
  P.gotovo = true;
  faza = "kraj";
  obrisiTok();
  const k = kljucRek();
  const stari = rekordi[k] || { poeni: 0, pogoci: 0 };
  const noviRek = P.poeni > stari.poeni;
  if (noviRek) { rekordi[k] = { poeni: P.poeni, pogoci: P.pogoci }; upisi(); }
  window.SFX && SFX.jackpot();
  if (soba) return soba.kraj();
  const proc = Math.round(P.pogoci * 100 / P.ukupno);
  showOverlay('<h2>' + (noviRek ? "🏆 Novi rekord!" : "🏁 Kraj serije") + '</h2>' +
    '<div class="res"><span>Koševi</span><b>' + P.pogoci + " / " + P.ukupno + ' (' + proc + '%)</b>' +
    '<span>Poeni</span><b>' + P.poeni + '</b>' +
    '<span>Najduži niz</span><b>' + P.najniz + '</b>' +
    '<span>Rekord</span><b>' + Math.max(stari.poeni, P.poeni) + '</b></div>' +
    '<p>' + nizSlika() + '</p>' +
    '<div class="btns"><button id="opetBtn">↺ Još jednom</button>' +
    '<button id="meniBtn">← Meni</button></div>');
  $("#opetBtn").onclick = () => novaSerija(P.ukupno, P.tez);
  $("#meniBtn").onclick = meni;
}
function nizSlika() {
  return P.istorija.map(z => z === "c" ? "🎯" : z === "k" ? "🏀" : "·").join(" ");
}
function javi(t, koliko) { poruka = t; porukaDo = performance.now() + (koliko || 1200); }

/* ---------- fizika ---------- */
function korak(dt) {
  const l = lopta;
  if (!l) return;
  kosT += dt;
  if (faza !== "leti") return;
  l.t += dt;
  const preY = l.y;
  l.vy -= G_UBR * dt;
  l.vx += vetar * dt;
  l.x += l.vx * dt;
  l.y += l.vy * dt;
  l.ug += l.vug * dt;

  const x1 = obrucX1(), x2 = obrucX2();
  if (!l.ubacena && preY > OBRUC_Y && l.y <= OBRUC_Y && l.vy < 0 && l.x > x1 && l.x < x2) pogodak();

  for (const rx of [x1, x2]) {                  // krajevi obruča su dve male kugle
    const dx = l.x - rx, dy = l.y - OBRUC_Y;
    const d = Math.hypot(dx, dy), r = R_LOPTE + R_OBRUCA;
    if (d < r && d > 1e-6) {
      const nx = dx / d, ny = dy / d;
      l.x = rx + nx * r; l.y = OBRUC_Y + ny * r;
      const vn = l.vx * nx + l.vy * ny;
      if (vn < 0) {
        l.vx -= 1.55 * vn * nx; l.vy -= 1.55 * vn * ny;
        l.vx *= .93; l.vy *= .93;
        l.vug += (l.vx * ny - l.vy * nx) * .5;
        if (!l.dodirObruc) { l.dodirObruc = true; tresi = 1; window.SFX && SFX.obruc(Math.min(.45, Math.abs(vn) * .1)); }
      }
    }
  }
  const tx = tablaX();                          // prednja strana table
  if (l.x + R_LOPTE > tx && l.x < tx && l.y > TABLA_D && l.y < TABLA_G && l.vx > 0) {
    l.x = tx - R_LOPTE;
    l.vx = -l.vx * .58; l.vy *= .9; l.vug *= .7;
    if (!l.dodirTabla) { l.dodirTabla = true; window.SFX && SFX.odskok(Math.min(.4, Math.abs(l.vx) * .09)); }
  }
  for (const ty of [TABLA_D, TABLA_G]) {        // donja i gornja ivica table
    const dx = l.x - tx, dy = l.y - ty;
    const d = Math.hypot(dx, dy), r = R_LOPTE + .012;
    if (d < r && d > 1e-6) {
      const nx = dx / d, ny = dy / d;
      l.x = tx + nx * r; l.y = ty + ny * r;
      const vn = l.vx * nx + l.vy * ny;
      if (vn < 0) {
        l.vx -= 1.5 * vn * nx; l.vy -= 1.5 * vn * ny;
        l.vx *= .9; l.vy *= .9;
        if (!l.dodirTabla) { l.dodirTabla = true; window.SFX && SFX.odskok(Math.min(.4, Math.abs(vn) * .09)); }
      }
    }
  }
  if (l.y - R_LOPTE < 0 && l.vy < 0) {          // parket
    l.y = R_LOPTE;
    if (Math.abs(l.vy) > .35) window.SFX && SFX.odskok(Math.min(.5, Math.abs(l.vy) * .07));
    l.vy = -l.vy * .68; l.vx *= .84; l.vug = -l.vx / R_LOPTE * .6;
    l.tlo++;
  }
  if (l.x < -.5 || l.x > SIRINA_SVETA + .6) l.gotova = l.gotova || l.t;
  if (l.tlo >= 1) l.gotova = l.gotova || l.t + (l.ubacena ? .35 : .45);
  if (l.t > 6) l.gotova = l.gotova || l.t;
  if (l.gotova && l.t >= l.gotova) { faza = "stao"; krajLopte(); }
}
function putanja(vx, vy, koliko) {              // pomoćni luk dok se cilja
  const t = [];
  let x = START.x, y = START.y, sx = vx, sy = vy;
  const dt = 1 / 60;
  for (let i = 0; i * dt < koliko; i++) {
    sy -= G_UBR * dt; sx += vetar * dt;
    x += sx * dt; y += sy * dt;
    if (y < 0) break;
    t.push([x, y]);
  }
  return t;
}
function izVuce(v) {                            // povlačenje prsta u brzinu lopte
  const dx = v.x - v.x0, dy = v.y - v.y0;
  const duz = Math.hypot(dx, dy);
  if (duz < cv.height * .04 || dy > 0) return null;
  const brzina = Math.min(15, duz / cv.height * 17);
  let ug = Math.atan2(-dy, dx);
  ug = Math.max(.09, Math.min(1.53, ug));       // ne šutira se nadole ni pravo uvis
  return { vx: Math.cos(ug) * brzina, vy: Math.sin(ug) * brzina, brzina, ug };
}

/* ---------- crtanje ---------- */
const sx = x => x * M;
const sy = y => POD - y * M;

function crtaj() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (tresi > 0) { ctx.translate((Math.random() - .5) * tresi * M * .05, (Math.random() - .5) * tresi * M * .05); }
  dvorana(w, h);
  parket(w, h);
  konstrukcija();
  tabla();
  obruc(true);
  senkaLopte();
  crtajLoptu();
  mreza();
  obruc(false);
  nisan();
  natpis(w);
}
function dvorana(w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, POD);
  g.addColorStop(0, "#080e1a"); g.addColorStop(.42, "#121f36"); g.addColorStop(1, "#1d2f4c");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  const vrh = cv.height / M;                    // koliko metara staje iznad poda
  krov(w, vrh);
  tribine(w);
  semafor(vrh);
}
function krov(w, vrh) {
  ctx.strokeStyle = "rgba(130,160,205,.13)";    // rešetkasta konstrukcija
  for (let i = 0; i < 2; i++) {
    const y = sy(vrh - .32 - i * .55);
    ctx.lineWidth = Math.max(1, .035 * M);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.lineWidth = Math.max(1, .018 * M);
    ctx.beginPath();
    for (let x = 0; x < SIRINA_SVETA; x += .5) {
      ctx.moveTo(sx(x), y); ctx.lineTo(sx(x + .25), y - .22 * M); ctx.lineTo(sx(x + .5), y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 4; i++) {                 // reflektori, tek toliko da se oseti svetlo
    const x = 1.0 + i * 1.5, y = vrh - .52;
    const svet = ctx.createRadialGradient(sx(x), sy(y), .03 * M, sx(x), sy(y), 1.1 * M);
    svet.addColorStop(0, "rgba(255,246,214,.13)"); svet.addColorStop(1, "rgba(255,246,214,0)");
    ctx.fillStyle = svet;
    ctx.beginPath(); ctx.arc(sx(x), sy(y), 1.1 * M, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(245,239,200,.55)";
    zaobljen(sx(x) - .14 * M, sy(y) - .04 * M, .28 * M, .08 * M, .025 * M); ctx.fill();
  }
}
function tribine(w) {
  const gore = sy(4.9), dole = sy(1.05);        // tribine počinju iza reklamne trake

function tackaNaPlatnu(e) {
  const r = cv.getBoundingClientRect();
  const s = cv.width / r.width;
  return { x: (e.clientX - r.left) * s, y: (e.clientY - r.top) * s };
}
cv.addEventListener("pointerdown", e => {
  if (faza !== "cekam") return;
  cv.setPointerCapture(e.pointerId);
  const t = tackaNaPlatnu(e);
  vucem = { x0: t.x, y0: t.y, x: t.x, y: t.y, id: e.pointerId };
});
cv.addEventListener("pointermove", e => {
  if (!vucem || e.pointerId !== vucem.id) return;
  const t = tackaNaPlatnu(e);
  vucem.x = t.x; vucem.y = t.y;
});
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) cv.addEventListener(ev, e => {
  if (!vucem || e.pointerId !== vucem.id) return;
  const v = vucem; vucem = null;
  if (ev !== "pointerup") return;
  const g = izVuce(v);
  if (!g) { javi("Povuci malo duže, prema košu", 900); return; }
  suti(g.vx, g.vy);
});

/* ---------- petlja i veličina ---------- */
function loop(ts) {
  raf = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(.05, (ts - lastTs) / 1000); lastTs = ts;
  visak += dt;
  let n = 0;
  while (visak >= KORAK && n++ < 400) { korak(KORAK); visak -= KORAK; }
  mrezaFaza = Math.max(0, mrezaFaza - dt * 2.2);
  tresi = Math.max(0, tresi - dt * 4);
  crtaj();
}
function fit() {
  const wrap = document.querySelector(".wrap"), nav = document.querySelector(".gamenav"), stage = document.querySelector(".stage");
  const limit = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  const kids = [...wrap.children].filter(el => el.offsetParent !== null);
  const others = kids.filter(el => el !== stage).reduce((a, el) => a + el.getBoundingClientRect().height, 0);
  const cs = getComputedStyle(wrap);
  const gaps = (parseFloat(cs.rowGap) || 0) * Math.max(0, kids.length - 1);
  const availH = limit - wrap.getBoundingClientRect().top - others - gaps - (parseFloat(cs.paddingBottom) || 0) - 12;
  const availW = Math.min(window.innerWidth - 20, 520);
  const w = Math.max(150, Math.floor(availW));
  const h = Math.max(240, Math.floor(Math.min(availH, w * 1.34)));
  cv.style.width = w + "px"; cv.style.height = h + "px";
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  M = cv.width / SIRINA_SVETA;
  POD = cv.height - .92 * M;
  if (POD < (OBRUC_Y + 1.35) * M) {             // na niskom ekranu se sve smanji da koš stane
    M = cv.height / (OBRUC_Y + 1.35 + .92);
    POD = cv.height - .92 * M;
  }
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 150));
window.addEventListener("load", fit);

/* ---------- igra u sobi ----------

function novaSoba(uloga) {
  soba = {
    uloga, postava: null, moj: 0, stanja: {},
    tekstProtivnika() {
      if (!this.postava) return "";
      return this.postava.map((x, i) => ({ x, i })).filter(o => o.i !== this.moj)
        .map(o => (o.x.ime || "igrač").slice(0, 7) + " " + ((this.stanja[o.x.id] || {}).poeni || 0))
        .slice(0, 2).join(" · ");
    },
    posaljiRezultat() {
      if (!P || !this.postava) return;
      const moj = { poeni: P.poeni, pogoci: P.pogoci, sut: P.sut, gotovo: P.gotovo ? 1 : 0 };
      this.stanja[Mreza.jaSam()] = moj;
      Mreza.posalji(Object.assign({ t: "R" }, moj));
    },
    kraj() {
      this.stanja[Mreza.jaSam()] = { poeni: P.poeni, pogoci: P.pogoci, sut: P.sut, gotovo: 1 };
      this.posaljiRezultat();
      this.tabela();
    },
    tabela() {
      const red = this.postava.map((x, i) => ({ ime: x.ime || "igrač", i, s: this.stanja[x.id] || { poeni: 0, pogoci: 0, gotovo: 0 } }))
        .sort((a, b) => b.s.poeni - a.s.poeni)
        .map(o => '<span><i style="background:' + BOJE_IGRACA[o.i % 4] + '"></i>' + o.ime +
          (o.i === this.moj ? " (ti)" : "") + (o.s.gotovo ? "" : " ⏳") + '</span><b>' +
          o.s.poeni + " · " + o.s.pogoci + "/" + P.ukupno + '</b>').join("");
      const naj = Math.max(...this.postava.map(x => (this.stanja[x.id] || {}).poeni || 0), 0);
      const jaVodim = P.poeni >= naj;
      showOverlay('<h2>' + (jaVodim ? "🏆 Najbolji si!" : "🏁 Kraj serije") + '</h2>' +
        '<p>' + P.pogoci + " od " + P.ukupno + ' — ' + P.poeni + ' poena. ⏳ znači da još šutira.</p>' +
        '<div class="res">' + red + '</div>' +
        '<div class="btns">' + (this.uloga === "domacin" ? '<button id="opetSoba">▶ Nova serija</button>' : '') +
        '<button id="izlazSoba">✖ Izađi iz sobe</button></div>');
      const ob = $("#opetSoba"); if (ob) ob.onclick = () => { cekaonica = true; pokaziKod(Mreza.kod()); };
      $("#izlazSoba").onclick = () => { sobaKraj(); meni(); };
    }
  };
}
function sobaKraj() {
  soba = null; cekaonica = false; ponoviVezu = null;
  try { if (window.Mreza) Mreza.zatvori(); } catch (e) { }
  try { if (window.CET) CET.iskljuci(); } catch (e) { }
  osveziTraku();
}
function sobaMeni() {
  showOverlay('<h2>🌐 Igra u sobi</h2>' +
    '<p>Do <b>četiri igrača</b> šutiraju <b>istu seriju</b>, svako na svom telefonu. ' +
    'Posle svakog šuta vidiš ko koliko ima.</p>' +
    '<div class="btns"><button id="sobaBtn">🌐 Napravi sobu</button>' +
    '<button id="udjiBtn">🔗 Uđi u sobu</button>' +
    '<button id="nazadSoba">← Nazad</button></div>');
  $("#sobaBtn").onclick = () => napraviSobu();
  $("#udjiBtn").onclick = udjiUSobu;
  $("#nazadSoba").onclick = () => { sobaKraj(); meni(); };
}
function napraviSobu() {
  if (!Mreza.podrzana()) {
    showOverlay('<h2>Nije podržano</h2><p>Ovaj pregledač ne ume vezu sa drugim telefonom.</p><button id="nb">← Nazad</button>');
    $("#nb").onclick = sobaMeni; return;
  }
  novaSoba("domacin"); ponoviVezu = napraviSobu;
  showOverlay('<h2>Pravim sobu…</h2><p>Spajam se na server za upoznavanje igrača.</p>');
  Mreza.napravi({ poruka: sobaPrimi, status: sobaStatus }).catch(() => { });
}
function udjiUSobu() {
  showOverlay('<h2>Uđi u sobu</h2><p>Ukucaj kod koji ti je poslao domaćin.</p>' +
    '<input id="kodIn" maxlength="5" placeholder="KOD" autocapitalize="characters" autocomplete="off" ' +
    'style="font:inherit;color:#eef2f9;background:#1b2a4a;border:1px solid #283a5e;border-radius:10px;padding:9px 11px;width:190px;text-align:center;letter-spacing:5px;text-transform:uppercase">' +
    '<div class="btns"><button id="idiBtn">🔗 Poveži se</button><button id="nazadBtn3">← Nazad</button></div>');
  $("#nazadBtn3").onclick = sobaMeni;
  $("#idiBtn").onclick = () => {
    const k = ($("#kodIn").value || "").trim().toUpperCase();
    if (k.length < 4) return;
    novaSoba("gost");
    ponoviVezu = () => { udjiUSobu(); setTimeout(() => { const i = $("#kodIn"); if (i) i.value = k; }, 50); };
    showOverlay('<h2>Spajam se…</h2><p>Tražim sobu <b style="color:#c9a227">' + k + '</b></p>');
    Mreza.pridruzi(k, { poruka: sobaPrimi, status: sobaStatus }).catch(() => { });
  };
  setTimeout(() => { const i = $("#kodIn"); if (i) i.focus(); }, 100);
}
function sobaStatus(st, detalj) {
  if (!soba) return;
  if (st === "spajam") showOverlay('<h2>Spajam se…</h2><p>' + (detalj || "Tražim server…") + '</p>');
  if (st === "cekam") { cekaonica = true; pokaziKod(detalj); }
  if (st === "ucesnici") { if (cekaonica) pokaziKod(Mreza.kod()); return; }
  if (st === "povezan") {
    window.CET && CET.ukljuci({ mreza: Mreza, ime: id => imeIz(id) });
    cekaonica = true; pokaziKod(Mreza.kod());
  }
  if (st === "prekinuto" && soba.uloga === "gost") {
    showOverlay('<h2>⚠️ Veza je prekinuta</h2><p>Domaćin je izašao ili nema signala.</p><button id="nbp">← Meni</button>');
    $("#nbp").onclick = () => { sobaKraj(); meni(); };
  }
  if (st === "greska") {
    showOverlay('<h2>Spajanje nije uspelo</h2><p>' + (detalj || "") + '</p>' +
      '<div class="btns">' + (ponoviVezu ? '<button id="opetBtn2x">↻ Probaj ponovo</button>' : '') +
      '<button id="nazadBtn4">← Nazad</button></div>');
    if (ponoviVezu) $("#opetBtn2x").onclick = () => { const f = ponoviVezu; Mreza.zatvori(); f(); };
    $("#nazadBtn4").onclick = () => { sobaKraj(); sobaMeni(); };
  }
}
function imeIz(id) {
  if (soba && soba.postava) { const x = soba.postava.find(p => p.id === id); if (x && x.ime) return x.ime; }
  const d = (window.Mreza && Mreza.drustvo() || []).find(p => p.id === id);
  return (d && d.ime) || "igrač";
}
function pokaziKod(kod) {
  const jeDomacin = soba && soba.uloga === "domacin";
  const svi = (Mreza.drustvo() || []).slice(0, 4);
  const red = svi.map((x, i) =>
    '<div class="mesto"><i style="background:' + BOJE_IGRACA[i % 4] + '"></i>' +
    (x.ime || (x.ja ? "ti (bez imena)" : "igrač bez imena")) + (x.ja ? ' <small>— ti</small>' : '') + '</div>').join("");
  showOverlay('<h2>Kod sobe</h2>' +
    '<div style="font-size:30px;font-weight:700;letter-spacing:8px;color:#c9a227;background:#16223a;' +
    'border:1px solid #283a5e;border-radius:12px;padding:10px 16px">' + kod + '</div>' +
    '<div class="mesta">' + red + (svi.length < 4 ? '<div class="mesto prazno">+ ima mesta do četiri igrača</div>' : '') + '</div>' +
    (jeDomacin ? '<p>' + SERIJE[izbor.serija].nm + ' · ' + TEZINE[izbor.tez].nm + '</p>' : '<p>Čekamo da domaćin krene…</p>') +
    '<div class="btns">' +
    (jeDomacin ? '<button id="serijaSoba">🔢 Serija</button><button id="tezSoba">⚙︎ Težina</button>' : '') +
    (jeDomacin && svi.length >= 2 ? '<button id="kreniBtn">▶ Kreni (' + svi.length + ')</button>' : '') +
    '<button id="odustBtn">Odustani</button></div>' +
    ((window.IGRAC && !IGRAC.ime()) ? '<p><button id="imeBtn2">👤 Upiši svoje ime</button></p>' : ''));
  const kb = $("#kreniBtn"); if (kb) kb.onclick = kreniUSobi;
  const sb = $("#serijaSoba"); if (sb) sb.onclick = () => { izbor.serija = izbor.serija === 10 ? 20 : 10; pokaziKod(kod); };
  const tb = $("#tezSoba"); if (tb) tb.onclick = () => {
    const red2 = Object.keys(TEZINE);
    izbor.tez = red2[(red2.indexOf(izbor.tez) + 1) % red2.length];
    pokaziKod(kod);
  };
  const ib = $("#imeBtn2"); if (ib) ib.onclick = () => IGRAC.pitaj(() => pokaziKod(kod));
  $("#odustBtn").onclick = () => { sobaKraj(); meni(); };
}
function kreniUSobi() {
  const svi = (Mreza.drustvo() || []).slice(0, 4).map((x, i) => ({ id: x.id, ime: x.ime || ("Igrač " + (i + 1)) }));
  if (svi.length < 2) return;
  Mreza.posalji({ t: "P", ig: svi, u: izbor.serija, z: izbor.tez });
  pocniUSobi(svi, izbor.serija, izbor.tez);
}
function pocniUSobi(svi, ukupno, tez) {
  soba.postava = svi;
  soba.moj = Math.max(0, svi.findIndex(x => x.id === Mreza.jaSam()));
  soba.stanja = {};
  for (const x of svi) soba.stanja[x.id] = { poeni: 0, pogoci: 0, sut: 0, gotovo: 0 };
  cekaonica = false;
  obrisiTok();
  novaSerija(ukupno, tez);
}
function sobaPrimi(m, od) {
  if (window.CET && CET.primi(m, od)) return;
  if (!soba || !m || !m.t) return;
  if (m.t === "P") {
    if (!m.ig.some(x => x.id === Mreza.jaSam())) {
      showOverlay('<h2>Soba je puna</h2><p>Serija je počela sa četvoro igrača.</p><button id="punaBtn">← Meni</button>');
      $("#punaBtn").onclick = () => { sobaKraj(); meni(); };
      return;
    }
    return pocniUSobi(m.ig, m.u, m.z);
  }
  if (m.t === "R") {
    soba.stanja[od] = { poeni: m.poeni, pogoci: m.pogoci, sut: m.sut, gotovo: m.gotovo };
    osveziTraku();
    if (P && P.gotovo) soba.tabela();
    return;
  }
}

/* ---------- start ---------- */
try { const t = localStorage.getItem(THEME_KEY); if (t) document.body.dataset.theme = t; } catch (e) { }
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) { }
};
ucitaj();
if (rekordi.izbor) izbor = Object.assign(izbor, rekordi.izbor);
if (!SERIJE[izbor.serija]) izbor.serija = 10;
if (!TEZINE[izbor.tez]) izbor.tez = "srednje";
fit(); crtaj(); meni();
raf = requestAnimationFrame(loop);

window.B = {
  OBRUC_Y, R_LOPTE, R_OBRUCA, TABLA_D, TABLA_G, START, SIRINA_SVETA, SERIJE, TEZINE, G_UBR,
  get P() { return P; }, get lopta() { return lopta; }, get faza() { return faza; },
  get rekordi() { return rekordi; }, get izbor() { return izbor; }, get soba() { return soba; },
  get vetar() { return vetar; }, set vetar(v) { vetar = v; },
  tablaX, obrucX1, obrucX2, novaSerija, novaLopta, suti, korak, putanja, izVuce,
  meni, biraj, krajSerije, ucitajTok, obrisiTok, sobaMeni, sobaKraj, kreniUSobi, osveziTraku, fit, crtaj,
  sx, get M() { return M; }, get POD() { return POD; },
  /* za probe: odigraj šut do kraja bez čekanja na animaciju */
  odsutiraj: (vx, vy) => {
    if (!suti(vx, vy)) return null;
    for (let i = 0; i < 40000 && faza === "leti"; i++) korak(KORAK);
    if (lopta && lopta.gotova) lopta.gotova = 1;
    if (faza === "leti") { faza = "stao"; krajLopte(); }
    return P.istorija[P.istorija.length - 1];
  },
  savrsenSut: () => {                            // aim koji najviše zaobilazi obruč
    const x1 = obrucX1(), x2 = obrucX2();
    let naj = null;
    for (let a = 0; a <= 16; a++) {
    const ug = .92 + a * .022;
    for (let k = 0; k <= 24; k++) {
      const xc = x1 + .09 + (x2 - x1 - .18) * k / 24;
      const dx = xc - START.x, dy = OBRUC_Y - START.y;
      const c = Math.cos(ug), imenilac = 2 * c * c * (dx * Math.tan(ug) - dy);
      if (imenilac <= 0) continue;
      const v = Math.sqrt(G_UBR * dx * dx / imenilac);
      const vx = c * v, vy = Math.sin(ug) * v;
      let zazor = 9, bilo = false;
      for (let n = 0; n <= 800; n++) {
        const t = n * .004;
        const x = START.x + vx * t, y = START.y + vy * t - .5 * G_UBR * t * t;
        if (y > OBRUC_Y) bilo = true;
        if (bilo && y < OBRUC_Y - .35) break;
        zazor = Math.min(zazor, Math.hypot(x - x1, y - OBRUC_Y), Math.hypot(x - x2, y - OBRUC_Y));
      }
      if (!naj || zazor > naj.zazor) naj = { vx, vy, zazor, xc, ug };
    }
    }
    return naj;
  }
};
