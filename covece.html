<style>
  :root {
    color-scheme: dark;
    --bg: #0e1626; --panel: #16223a; --panel-2: #1b2a4a;
    --ink: #eef2f9; --ink-dim: #9fb0cc; --line: #283a5e;
    --gold: #c9a227; --good: #2e9e6b; --bad: #d65a4e;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f2f4f8; --panel: #ffffff; --panel-2: #eef1f7;
    --ink: #1b2a4a; --ink-dim: #5a6884; --line: #d7dded;
    --gold: #a9851a; --good: #1f7d52; --bad: #c0473c;
    --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Calibri, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  button { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; cursor: pointer;
    touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; }
  @media (hover: hover) { button:hover:not(:disabled) { border-color: var(--gold); } }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 7px;
          min-height: 100dvh; padding: 6px 10px 8px; }
  .col { width: min(100vw - 20px, 520px); }
  header { display: flex; align-items: center; gap: 10px;
           border-left: 4px solid var(--gold); padding: 3px 0 3px 10px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  header .sub { color: var(--ink-dim); font-size: 12px; }
  .spacer { flex: 1; }

  .igraci { display: flex; gap: 6px; }
  .igrac { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0;
           background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 5px 8px; font-size: 12.5px; color: var(--ink-dim); }
  .igrac i { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .igrac span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .igrac b { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }
  .igrac.naRedu { border-color: var(--gold); color: var(--ink); }

  .stage { position: relative; }
  canvas { display: block; border: 1px solid var(--line); border-radius: 12px;
           background: #101d33; box-shadow: var(--shadow); touch-action: manipulation; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
             align-items: center; justify-content: center; text-align: center; padding: 16px;
             background: rgba(8,14,26,.93); backdrop-filter: blur(3px); border-radius: 12px; z-index: 5;
             color: #eef2f9; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; font-size: 13px; color: #9fb0cc; max-width: 320px; }
  .overlay .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .overlay button { background: #16223a; color: #eef2f9; border-color: #283a5e; }
  .overlay .izbor { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 280px; }
  .overlay .izbor button { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
  .overlay .izbor small { color: #9fb0cc; font-size: 11.5px; font-weight: 400; }
  .overlay .res { display: grid; grid-template-columns: auto auto; gap: 3px 14px; font-size: 14px; color: #9fb0cc; }
  .overlay .res b { color: #eef2f9; }
  .overlay .res span i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .overlay .mesta { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 280px; font-size: 13.5px; color: #eef2f9; }
  .overlay .mesto { display: flex; align-items: center; gap: 7px; background: #16223a;
                    border: 1px solid #283a5e; border-radius: 9px; padding: 5px 9px; }
  .overlay .mesto i { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .overlay .mesto small { color: #9fb0cc; }
  .overlay .mesto.prazno { color: #9fb0cc; border-style: dashed; justify-content: center; font-size: 12.5px; }

  .akcije { display: flex; gap: 8px; align-items: center; }
  .akcije .poruka { flex: 1; font-size: 13px; color: var(--ink-dim); min-width: 0;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .akcije .baci { font-size: 16px; font-weight: 700; padding: 10px 18px; border-color: var(--gold); color: var(--gold); }

  .foot { color: var(--ink-dim); font-size: 11px; line-height: 1.4; text-align: center; }
  .foot a { color: var(--ink-dim); }
  @media (max-height: 780px) { .foot { display: none; } }
  @media (max-height: 680px) { header .sub { display: none; } }
  @media (max-height: 620px) { header h1 { font-size: 15px; } .wrap { gap: 5px; } .igraci { display: none; } }
</style>

<body data-theme="dark">
<div class="wrap">
  <header class="col">
    <div>
      <h1>Čoveče, ne ljuti se</h1>
      <div class="sub">Šestica izvodi, ista polja se ne dele</div>
    </div>
    <div class="spacer"></div>
    <button id="theme" title="Svetla/tamna tema">☀︎ / ☾</button>
  </header>

  <div class="igraci col" id="igraci"></div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </div>

  <div class="akcije col">
    <button class="baci" id="baciBtn">🎲 Baci</button>
    <span class="poruka" id="poruka">Ko prvi izvede sve četiri figure — pobedio je.</span>
  </div>

  <div class="foot col">
    Šestica izvodi figuru iz kuće i donosi novo bacanje. Ko stane na tuđu figuru — vraća je kući.
    <br><a href="igre.html">🎮 Sve igre</a> · <a href="pomoc.html">❔ Pomoć</a> · <a href="index.html">← Border Wait</a>
  </div>
</div>

<script src="igre.js"></script>
<script src="mreza.js"></script>
<script src="cet.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "covece.v1", THEME_KEY = "sudoku.theme";
const cv = $("#cv"), ctx = cv.getContext("2d");

/* ---------- tabla ----------
   Klasična tabla 11×11: staza od 40 polja u krug, četiri kuće po uglovima i
   četiri niza od po četiri polja ka sredini. Svaki igrač ima svoj put: 40 polja
   staze počev od svog starta, pa svoja četiri polja u cilju. */
const STAZA = [
  [0, 4], [1, 4], [2, 4], [3, 4], [4, 4], [4, 3], [4, 2], [4, 1], [4, 0], [5, 0],
  [6, 0], [6, 1], [6, 2], [6, 3], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4], [10, 5],
  [10, 6], [9, 6], [8, 6], [7, 6], [6, 6], [6, 7], [6, 8], [6, 9], [6, 10], [5, 10],
  [4, 10], [4, 9], [4, 8], [4, 7], [4, 6], [3, 6], [2, 6], [1, 6], [0, 6], [0, 5]
];
const CILJ = [                                  // četiri polja ka sredini, po igraču
  [[1, 5], [2, 5], [3, 5], [4, 5]],
  [[5, 1], [5, 2], [5, 3], [5, 4]],
  [[9, 5], [8, 5], [7, 5], [6, 5]],
  [[5, 9], [5, 8], [5, 7], [5, 6]]
];
const KUCA = [                                  // gde figure čekaju
  [[0, 0], [1, 0], [0, 1], [1, 1]],
  [[9, 0], [10, 0], [9, 1], [10, 1]],
  [[9, 9], [10, 9], [9, 10], [10, 10]],
  [[0, 9], [1, 9], [0, 10], [1, 10]]
];
const START = [0, 10, 20, 30];                  // gde svaki izlazi na stazu
const BOJE = [
  { p: "#d65a4e", s: "#f0a89f", nm: "crveni" },
  { p: "#c9a227", s: "#eed88c", nm: "žuti" },
  { p: "#3f8fd6", s: "#a8cdee", nm: "plavi" },
  { p: "#2e9e6b", s: "#93d9b6", nm: "zeleni" }
];
const KUCI = -1, CILJANO = 44;                  // -1 = u kući, put ide 0..43

function poljeZa(igrac, mesto) {                // gde se figura crta
  if (mesto === KUCI) return null;
  if (mesto < 40) return STAZA[(START[igrac] + mesto) % 40];
  return CILJ[igrac][mesto - 40];
}
function stazaIndeks(igrac, mesto) {            // isto polje staze za sve igrače
  return mesto < 40 ? (START[igrac] + mesto) % 40 : -1;
}

/* ---------- stanje ---------- */
let G = null;          // {figure:[[4]], naRedu, kocka, rezim, ljudi, imena, gotovo, poredak}
let animacija = null;  // {igrac, figura, od, do, t}
let cekamPotez = false, kockaVrti = 0, poslednjiKliknuti = -1;
let rekordi = {};
let soba = null, cekaonica = false, ponoviVezu = null;

function ucitaj() { try { rekordi = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { rekordi = {}; } }
function upisi() { try { localStorage.setItem(KEY, JSON.stringify(rekordi)); } catch (e) { } }
function sacuvajPartiju() {
  if (!G || G.rezim === "mreza") return;
  try { localStorage.setItem(KEY + ".tok", JSON.stringify(G)); } catch (e) { }
}
function obrisiPartiju() { try { localStorage.removeItem(KEY + ".tok"); } catch (e) { } }
function ucitajPartiju() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY + ".tok") || "null");
    if (s && s.figure && !s.gotovo) return s;
  } catch (e) { }
  return null;
}

/* ---------- pravila ---------- */
function novaIgra(rezim, ljudi, imena) {
  G = {
    rezim, ljudi,                               // ljudi: niz true/false — ko je čovek
    imena: imena || ljudi.map((c, i) => c ? "Igrač " + (i + 1) : "Računar " + (i + 1)),
    figure: [0, 1, 2, 3].map(() => [KUCI, KUCI, KUCI, KUCI]),
    naRedu: 0, kocka: 0, bacanja: 0, gotovo: false, poredak: [], poruka: ""
  };
  animacija = null; cekamPotez = false;
  hideOverlay(); osveziIgrace(); osveziDugme();
  javi("Na potezu je " + imeIgraca(0) + ".");
  sacuvajPartiju();
  if (naPotezuRacunar()) setTimeout(potezRacunara, 700);
}
const imeIgraca = i => (G && G.imena[i]) || BOJE[i].nm;
const mojIndeks = () => soba && soba.postava ? soba.moj : (G ? G.naRedu : 0);
function naPotezuRacunar() {
  if (!G || G.gotovo || animacija) return false;
  if (G.rezim === "mreza") return !!soba && soba.uloga === "domacin" && !G.ljudi[G.naRedu];
  return !G.ljudi[G.naRedu];
}
function naPotezuJa() {
  if (!G || G.gotovo) return false;
  if (G.rezim === "mreza") return G.naRedu === mojIndeks();
  return !!G.ljudi[G.naRedu];
}
function gotovIgrac(i) { return G.figure[i].every(m => m >= 40); }

function potezi(igrac, kocka) {                 // svi mogući potezi za bačeni broj
  const izlaz = [];
  const moje = G.figure[igrac];
  for (let f = 0; f < 4; f++) {
    const m = moje[f];
    if (m === KUCI) {
      if (kocka === 6 && !moje.some((x, j) => j !== f && x === 0)) izlaz.push({ figura: f, cilj: 0 });
      continue;
    }
    const novo = m + kocka;
    if (novo > 43) continue;                    // u cilj se ulazi tačno
    if (moje.some((x, j) => j !== f && x === novo)) continue;   // svoja figura blokira
    izlaz.push({ figura: f, cilj: novo });
  }
  return izlaz;
}
function baci(broj, odmah) {
  if (!G || G.gotovo || animacija || cekamPotez) return;
  const k = broj || (1 + ((Math.random() * 6) | 0));
  G.kocka = k; G.bacanja++;
  if (soba && G.rezim === "mreza" && !primam) Mreza.posalji({ t: "K", k });
  if (!odmah) { window.SFX && SFX.drum(); kockaVrti = performance.now() + 420; }
  const posle = (ms, f) => odmah ? f() : setTimeout(f, ms);
  posle(430, () => {
    const mogu = potezi(G.naRedu, k);
    if (!mogu.length) {
      const uKuci = G.figure[G.naRedu].every(m => m === KUCI);
      if (k === 6 || (uKuci && G.bacanja < 3)) {   // šestica i tri pokušaja iz kuće
        javi(imeIgraca(G.naRedu) + " je bacio " + k + " — baca ponovo.");
        osveziDugme();
        if (naPotezuRacunar() && !odmah) setTimeout(potezRacunara, 600);
        return;
      }
      javi(imeIgraca(G.naRedu) + " je bacio " + k + " — nema poteza.");
      if (!odmah) window.SFX && SFX.bad();
      posle(700, sledeci);
      return;
    }
    const razliciti = new Set(mogu.map(x => (G.figure[G.naRedu][x.figura] === KUCI ? "K" : G.figure[G.naRedu][x.figura]) + ">" + x.cilj));
    if (mogu.length === 1 || razliciti.size === 1) {   // nema šta da se bira
      posle(350, () => odigraj(mogu[0].figura, false, odmah));
      return;
    }
    cekamPotez = true;
    javi("Bacio si " + k + " — izaberi figuru.");
    osveziDugme();
    if (naPotezuRacunar() && !odmah) setTimeout(potezRacunara, 500);
  });
  osveziDugme();
}
function odigraj(figura, tiho, odmah) {
  if (!G || G.gotovo || animacija) return false;
  const mogu = potezi(G.naRedu, G.kocka);
  const potez = mogu.find(p => p.figura === figura);
  if (!potez) return false;
  cekamPotez = false;
  const igrac = G.naRedu, od = G.figure[igrac][figura];
  G.figure[igrac][figura] = potez.cilj;
  if (odmah) { zavrsiPotez(igrac, figura); return true; }
  animacija = { igrac, figura, od: od === KUCI ? 0 : od, do: potez.cilj, t: 0, izKuce: od === KUCI };
  return true;
}
function zavrsiPotez(igrac, figura) {
  const mesto = G.figure[igrac][figura];
  let izbacio = null;
  if (mesto < 40) {                             // tuđa figura na istom polju ide kući
    const polje = stazaIndeks(igrac, mesto);
    for (let i = 0; i < 4; i++) {
      if (i === igrac) continue;
      for (let f = 0; f < 4; f++) {
        const m = G.figure[i][f];
        if (m < 40 && m !== KUCI && stazaIndeks(i, m) === polje) {
          G.figure[i][f] = KUCI;
          izbacio = { igrac: i, figura: f };
        }
      }
    }
  }
  if (izbacio) {
    window.SFX && SFX.stamp();
    javi(imeIgraca(igrac) + " je vratio kući " + imeIgraca(izbacio.igrac) + "!");
  } else if (mesto >= 40) {
    window.SFX && SFX.coin();
    javi(imeIgraca(igrac) + " je uveo figuru u cilj.");
  } else window.SFX && SFX.card();

  if (gotovIgrac(igrac) && G.poredak.indexOf(igrac) < 0) {
    G.poredak.push(igrac);
    window.SFX && SFX.win();
    javi(imeIgraca(igrac) + " je završio — " + (G.poredak.length === 1 ? "pobednik!" : G.poredak.length + ". mesto"));
  }
  osveziIgrace(); sacuvajPartiju(); sinhronizuj();
  if (G.poredak.length) return kraj();          // ko prvi izvede sve četiri — partija je gotova
  if (G.kocka === 6) {                          // šestica donosi novo bacanje
    G.bacanja = 0;
    javi(imeIgraca(igrac) + " je bacio šesticu — baca ponovo.");
    osveziDugme(); sinhronizuj();
    if (naPotezuRacunar()) setTimeout(potezRacunara, 650);
    return;
  }
  sledeci();
}
function sledeci() {
  if (!G || G.gotovo) return;
  let i = G.naRedu;
  for (let k = 0; k < 4; k++) {
    i = (i + 1) % 4;
    if (G.poredak.indexOf(i) < 0) break;
  }
  G.naRedu = i; G.kocka = 0; G.bacanja = 0; cekamPotez = false;
  javi("Na potezu je " + imeIgraca(i) + ".");
  osveziIgrace(); osveziDugme(); sacuvajPartiju(); sinhronizuj();
  if (naPotezuRacunar()) setTimeout(potezRacunara, 700);
}
function kraj() {
  G.gotovo = true;
  obrisiPartiju();
  const napredak = i => G.figure[i].reduce((a, m) => a + (m === KUCI ? -1 : m), 0);
  const preostali = [0, 1, 2, 3].filter(i => G.poredak.indexOf(i) < 0).sort((a, b) => napredak(b) - napredak(a));
  const poredak = G.poredak.concat(preostali);
  const jaSam = G.rezim === "mreza" ? mojIndeks() : G.ljudi.indexOf(true);
  const mesto = poredak.indexOf(jaSam) + 1;
  if (G.rezim === "protiv") {
    const k = "protiv" + G.ljudi.filter(x => !x).length;
    if (mesto === 1) rekordi[k] = (rekordi[k] || 0) + 1;
    upisi();
  }
  window.SFX && (mesto === 1 ? SFX.jackpot() : SFX.siren());
  const red = poredak.map((i, k) =>
    '<span><i style="background:' + BOJE[i].p + '"></i>' + imeIgraca(i) + '</span><b>' + (k + 1) + '. mesto</b>').join("");
  showOverlay('<h2>' + (mesto === 1 ? "🏆 Pobedio si!" : "🏁 Kraj partije") + '</h2>' +
    '<div class="res">' + red + '</div>' +
    '<div class="btns">' +
    (G.rezim === "mreza" ? (soba && soba.uloga === "domacin" ? '<button id="opetSoba">▶ Nova partija</button>' : '') +
      '<button id="izlazSoba">✖ Izađi iz sobe</button>'
      : '<button id="opetBtn">⟲ Još jednom</button><button id="meniBtn">← Meni</button>') + '</div>');
  const ob = $("#opetBtn"); if (ob) ob.onclick = () => novaIgra(G.rezim, G.ljudi, G.imena);
  const mb = $("#meniBtn"); if (mb) mb.onclick = meni;
  const os = $("#opetSoba"); if (os) os.onclick = () => { cekaonica = true; pokaziKod(Mreza.kod()); };
  const iz = $("#izlazSoba"); if (iz) iz.onclick = () => { sobaKraj(); meni(); };
}

/* ---------- računar ---------- */
function potezRacunara() {
  if (!G || G.gotovo || !naPotezuRacunar()) return;
  if (!G.kocka || (!cekamPotez && !potezi(G.naRedu, G.kocka).length)) return baci();
  const mogu = potezi(G.naRedu, G.kocka);
  if (!mogu.length) return;
  let naj = null, najOcena = -1e9;
  for (const p of mogu) {
    const o = oceniPotez(G.naRedu, p);
    if (o > najOcena) { najOcena = o; naj = p; }
  }
  setTimeout(() => odigraj(naj.figura), 250);
}
function oceniPotez(igrac, p) {
  let o = 0;
  const od = G.figure[igrac][p.figura];
  if (p.cilj >= 40) o += 60 + p.cilj;                   // ulazak u cilj je najvredniji
  if (od === KUCI) o += 45;                             // izvođenje iz kuće
  if (p.cilj < 40) {
    const polje = stazaIndeks(igrac, p.cilj);
    for (let i = 0; i < 4; i++) {
      if (i === igrac) continue;
      for (const m of G.figure[i]) {
        if (m !== KUCI && m < 40 && stazaIndeks(i, m) === polje) o += 80 + m;   // izbacivanje
      }
    }
    o += ugrozenost(igrac, od) * 12 - ugrozenost(igrac, p.cilj) * 14;
  }
  o += p.cilj * .35;                                    // inače guraj napred
  return o;
}
function ugrozenost(igrac, mesto) {              // koliko protivnika može da me pojede
  if (mesto === KUCI || mesto >= 40) return 0;
  const polje = stazaIndeks(igrac, mesto);
  let n = 0;
  for (let i = 0; i < 4; i++) {
    if (i === igrac) continue;
    for (const m of G.figure[i]) {
      if (m === KUCI || m >= 40) continue;
      const njihovo = stazaIndeks(i, m);
      let razlika = (polje - njihovo + 40) % 40;
      if (razlika >= 1 && razlika <= 6 && m + razlika <= 43) n++;

/* ---------- crtanje ---------- */
let P = 10;                                      // veličina polja u pikselima
function crtaj() {
  const w = cv.width;
  P = w / 11;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, cv.height);
  ctx.fillStyle = "#101d33"; ctx.fillRect(0, 0, w, cv.height);

  for (let i = 0; i < 4; i++) {                 // kuće i ciljna polja
    ctx.fillStyle = "rgba(255,255,255,.045)";
    const k = KUCA[i];
    const x0 = Math.min(...k.map(c => c[0])), y0 = Math.min(...k.map(c => c[1]));
    zaobljen(x0 * P + P * .1, y0 * P + P * .1, P * 1.8, P * 1.8, P * .3);
    ctx.fill();
    for (const c of k) polje(c[0], c[1], BOJE[i].p, .3);
    for (const c of CILJ[i]) polje(c[0], c[1], BOJE[i].p, .55);
  }
  for (let i = 0; i < 40; i++) {                // staza
    const s = STAZA[i];
    const start = START.indexOf(i);
    polje(s[0], s[1], start >= 0 ? BOJE[start].p : "#9fb0cc", start >= 0 ? .85 : .22);
  }
  kockaNaSredini();

  for (let i = 0; i < 4; i++) {                 // figure
    for (let f = 0; f < 4; f++) {
      const m = G ? G.figure[i][f] : KUCI;
      if (animacija && animacija.igrac === i && animacija.figura === f) continue;
      const c = m === KUCI ? KUCA[i][f] : poljeZa(i, m);
      figura(c[0], c[1], i, mozeDaSePomeri(i, f));
    }
  }
  if (animacija) {                              // figura u pokretu
    const a = animacija;
    const uk = a.izKuce ? 1 : Math.max(1, a.do - a.od);
    const t = Math.min(1, a.t / (uk * .13));
    const korak = a.izKuce ? a.do : a.od + (a.do - a.od) * t;
    const celi = Math.floor(korak), delic = korak - celi;
    const c1 = poljeZa(a.igrac, Math.min(43, celi));
    const c2 = poljeZa(a.igrac, Math.min(43, celi + 1));
    const x = c1[0] + (c2[0] - c1[0]) * delic, y = c1[1] + (c2[1] - c1[1]) * delic;
    figura(x, y, a.igrac, false, true);
  }
}
function zaobljen(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function polje(cx, cy, boja, jacina) {
  ctx.beginPath();
  ctx.arc((cx + .5) * P, (cy + .5) * P, P * .38, 0, 7);
  ctx.fillStyle = "rgba(16,29,51,.9)"; ctx.fill();
  ctx.globalAlpha = jacina;
  ctx.fillStyle = boja; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.stroke();
}
function figura(cx, cy, igrac, moze, ukretanju) {
  const x = (cx + .5) * P, y = (cy + .5) * P, r = P * .32;
  ctx.beginPath(); ctx.ellipse(x, y + r * .55, r * .9, r * .38, 0, 0, 7);
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  ctx.fillStyle = BOJE[igrac].p; ctx.fill();
  ctx.lineWidth = ukretanju ? 3 : 2;
  ctx.strokeStyle = ukretanju ? "#fff" : "rgba(255,255,255,.75)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(x - r * .3, y - r * .3, r * .3, 0, 7);
  ctx.fillStyle = BOJE[igrac].s; ctx.fill();
  if (moze) {
    ctx.beginPath(); ctx.arc(x, y, r * 1.45 + Math.sin(performance.now() / 220) * P * .04, 0, 7);
    ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.stroke();
  }
}
function mozeDaSePomeri(igrac, f) {
  if (!G || !cekamPotez || G.naRedu !== igrac || !naPotezuJa()) return false;
  return potezi(igrac, G.kocka).some(p => p.figura === f);
}
function kockaNaSredini() {
  const x = 5 * P, y = 5 * P, s = P * .92, r = P * .16;
  ctx.save();
  ctx.translate(x + P * .04, y + P * .04);

  ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.stroke();
  let broj = G ? G.kocka : 0;
  if (performance.now() < kockaVrti) broj = 1 + ((performance.now() / 70) | 0) % 6;
  if (broj) {
    const t = [[.5, .5]], d = [[.28, .28], [.72, .72]], tri = [[.28, .28], [.5, .5], [.72, .72]],
      cet = [[.28, .28], [.72, .28], [.28, .72], [.72, .72]],
      pet = [[.28, .28], [.72, .28], [.5, .5], [.28, .72], [.72, .72]],
      sest = [[.28, .28], [.72, .28], [.28, .5], [.72, .5], [.28, .72], [.72, .72]];
    const tacke = [t, d, tri, cet, pet, sest][broj - 1];

}

raf = requestAnimationFrame(loop);

window.C = {
  STAZA, CILJ, KUCA, START, BOJE, KUCI,
  get G() { return G; }, get animacija() { return animacija; }, get cekamPotez() { return cekamPotez; },
  get rekordi() { return rekordi; }, get soba() { return soba; },
  poljeZa, stazaIndeks, potezi, novaIgra, baci, odigraj, sledeci, oceniPotez, ugrozenost,
  potezRacunara, meni, biraj, fit, crtaj, gotovIgrac, imeIgraca,
  postavi: (igrac, figura, mesto) => { G.figure[igrac][figura] = mesto; },
  sobaMeni, sobaKraj, kreniUSobi, sinhronizuj,
  naRed: i => { G.naRedu = i; G.kocka = 0; cekamPotez = false; },
  zavrsiAnimaciju: () => { if (animacija) { const a = animacija; animacija = null; zavrsiPotez(a.igrac, a.figura); } },
  odigrajOdmah: f => odigraj(f, false, true),
  baciOdmah: k => baci(k, true),
  simuliraj: maks => {                          // odigra celu partiju bez čekanja, za provere
    let n = 0;
    while (G && !G.gotovo && n++ < (maks || 5000)) {
      if (animacija) { const a = animacija; animacija = null; zavrsiPotez(a.igrac, a.figura); continue; }
      if (cekamPotez) {
        const mogu = potezi(G.naRedu, G.kocka);
        if (!mogu.length) { cekamPotez = false; sledeci(); continue; }
        let naj = mogu[0], najO = -1e9;
        for (const p of mogu) { const o = oceniPotez(G.naRedu, p); if (o > najO) { najO = o; naj = p; } }
        odigraj(naj.figura, false, true);
        continue;
      }
      baci(0, true);
    }
    return n;
  }
};
