<style>
  :root {
    color-scheme: dark;
    --bg: #0e1626; --panel: #16223a; --panel-2: #1b2a4a;
    --ink: #eef2f9; --ink-dim: #9fb0cc; --line: #283a5e;
    --gold: #c9a227; --good: #2e9e6b; --bad: #d65a4e;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f2f4f8; --panel: #ffffff; --panel-2: #eef1f7;
    --ink: #1b2a4a; --ink-dim: #5a6884; --line: #d7dded;
    --gold: #a9851a; --good: #1f7d52; --bad: #c0473c;
    --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Calibri, "Segoe UI", system-ui, sans-serif;

  }
  button { font: inherit; color: var(--ink); background: var(--panel);

    touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  @media (hover: hover) { button:hover { border-color: var(--gold); } }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 7px;
          min-height: 100dvh; padding: 6px 10px 8px; }
  .col { width: min(100vw - 20px, 460px); }
  header { display: flex; align-items: center; gap: 10px;
           border-left: 4px solid var(--gold); padding: 3px 0 3px 10px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  header .sub { color: var(--ink-dim); font-size: 12px; }

  .hud { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-dim);
         white-space: nowrap; overflow: hidden; }

  .hud b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
  .hud .od { color: var(--ink-dim); }
  .cip { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px;
         font-variant-numeric: tabular-nums; }
  .cip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
  .cip.pao { opacity: .35; }
  @media (max-width: 360px) { .hud { font-size: 11.5px; gap: 5px; } }
  #hProt:not(:empty) { color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 999px; padding: 1px 8px; }

  .stage { position: relative; }
  canvas { display: block; border: 1px solid var(--line); border-radius: 12px;
           background: #0a1120; box-shadow: var(--shadow); touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
             align-items: center; justify-content: center; text-align: center; padding: 16px;
             background: rgba(8,14,26,.92); backdrop-filter: blur(3px); border-radius: 12px; z-index: 5;
             color: #eef2f9; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; font-size: 13px; color: #9fb0cc; max-width: 300px; }

  .overlay ul li { margin-bottom: 5px; }
  .overlay .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .overlay .res { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 14px; color: #9fb0cc; }
  .overlay .res b { color: #eef2f9; font-variant-numeric: tabular-nums; }
  .overlay button { background: #16223a; color: #eef2f9; border-color: #283a5e; }
  .overlay .tez { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 260px; }
  .overlay .tez button { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
  .overlay .tez small { color: #9fb0cc; font-size: 11.5px; font-weight: 400; }

  .tipke { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tipke button { font-size: 19px; padding: 8px 0; line-height: 1.1; }
  .tipke button b { display: block; font-size: 9.5px; color: var(--ink-dim); font-weight: 400; }

  .foot { color: var(--ink-dim); font-size: 11px; line-height: 1.4; text-align: center; }

  @media (max-height: 780px) { .foot { display: none; } }

  @media (max-height: 600px) { header h1 { font-size: 15px; } .wrap { gap: 5px; }
                               .tipke button { font-size: 17px; padding: 6px 0; } .tipke button b { display: none; } }
  @media (orientation: landscape) and (max-height: 520px) {
    header .sub, .foot { display: none; }
    header { padding: 0 0 0 10px; } header h1 { font-size: 15px; }

<div class="wrap">

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "teren.v1", THEME_KEY = "sudoku.theme";

/* ---------- tabla ----------
   Tabla je mnogo veća od ekrana: ekran je prozor koji prati igrača, a ceo teren se
   vidi na mapici u uglu. Vlasništvo i tragovi stoje u ravnim nizovima, po ćeliji
   jedan bajt. */
const KOL = 132, RED = 180, POLJA = KOL * RED;
const VID_KOL = 38;                            // koliko ćelija stane preko ekrana
const cv = $("#cv"), ctx = cv.getContext("2d");
const mapaCv = document.createElement("canvas");    // cela tabla, jedan piksel po ćeliji
const mctx = mapaCv.getContext("2d");
mapaCv.width = KOL; mapaCv.height = RED;
let PPC = 10;                                  // pravih piksela po ćeliji
let vidW = VID_KOL, vidH = 50;                 // koliko ćelija se vidi
const kam = { x: 0, y: 0 };                    // gornji levi ugao prozora, u ćelijama

const TEZINE = {
  lako:    { nm: "Lako",    opis: "tri protivnika, ne love",       botovi: 3, brzina: 6.4, agro: 0,  dubina: [7, 16],  domet: 18, cilj: 10 },
  srednje: { nm: "Srednje", opis: "četiri, gledaju tuđi trag",     botovi: 4, brzina: 7.4, agro: 12, dubina: [9, 20],  domet: 24, cilj: 12 },
  tesko:   { nm: "Teško",   opis: "šest, brzi su i love te",       botovi: 6, brzina: 8.1, agro: 18, dubina: [10, 24], domet: 30, cilj: 15 }
};
const BRZINA_JA = 7.8;
const STARTNI_MIR = 6;                         // sekundi koliko protivnici ostaju na svom terenu
const BOJE = [
  { p: "#c9a227", t: "#f5da7a", nm: "ti" },
  { p: "#d65a4e", t: "#f5a79e", nm: "crveni" },
  { p: "#3f8fd6", t: "#a0cbef", nm: "plavi" },
  { p: "#2e9e6b", t: "#8adcb4", nm: "zeleni" },
  { p: "#9a6bd6", t: "#c9aaf0", nm: "ljubičasti" },
  { p: "#d98324", t: "#f3c188", nm: "narandžasti" },
  { p: "#2ba6a6", t: "#8ad9d9", nm: "tirkizni" }
];

const idx = (x, y) => y * KOL + x;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const vlas = new Uint8Array(POLJA);        // 0 = ničije, inače id igrača
const tragV = new Uint8Array(POLJA);       // čiji trag leži na polju
const oznaka = new Uint8Array(POLJA);      // radna, za plavljenje
const stek = new Int32Array(POLJA);

let igraci = [], ja = null;
let stanje = "meni";                       // meni | igra | pauza | kraj | ceka
let tez = "srednje", cilj = 50, vreme = 0, raf = null, lastTs = 0, prljav = true;
let priprema = 0;                              // kratak predah pre nego što krene
let rekordi = {};                          // po težini: {pr, vreme}

/* ---------- rekordi ---------- */
function ucitaj() { try { rekordi = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { rekordi = {}; } }
function upisi() { try { localStorage.setItem(KEY, JSON.stringify(rekordi)); } catch (e) { } }
function zapamtiRezultat(pr, sek, pobeda) {
  const r = rekordi[tez] || { pr: 0, vreme: 0 };
  if (pr > r.pr) r.pr = Math.round(pr);
  if (pobeda && (!r.vreme || sek < r.vreme)) r.vreme = Math.round(sek);
  rekordi[tez] = r; upisi();
}
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

/* ---------- nova partija ---------- */
function noviIgrac(i, bot) {
  return {
    id: i + 1, boja: BOJE[i], bot: bot,
    x: 0, y: 0, dx: 0, dy: -1, p: 0, sled: null,
    trag: [], dom: null, meta: null, dubina: 8, ziv: true, ozivi: 0, odmor: 0,
    brzina: bot ? TEZINE[tez].brzina : BRZINA_JA,
    polja: 0, pr: 0
  };
}
function bazu(e, x, y) {
  e.x = clamp(x, 4, KOL - 5); e.y = clamp(y, 4, RED - 5);
  for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) vlas[idx(e.x + i, e.y + j)] = e.id;
  e.dx = 0; e.dy = e.y > RED / 2 ? -1 : 1; e.p = 0; e.trag.length = 0; e.dom = null; e.meta = null;
}
function rasporedi(n, rnd) {                 // svako dobije svoj ugao table, isto na oba telefona
  const a0 = rnd() * Math.PI * 2, out = [];
  for (let i = 0; i < n; i++) {
    const a = a0 + i * 2 * Math.PI / n;
    const r = .62 + rnd() * .28;               // ne svi na istom krugu, ali svako u svom pravcu
    out.push({ x: Math.round(KOL / 2 + Math.cos(a) * (KOL / 2 - 8) * r), y: Math.round(RED / 2 + Math.sin(a) * (RED / 2 - 10) * r) });
  }
  return out;
}
function nova(seme, tezina) {
  if (tezina) tez = tezina;
  const T = TEZINE[tez];
  cilj = T.cilj;
  const rnd = mulberry32(seme | 0);
  vlas.fill(0); tragV.fill(0);
  igraci = [];
  for (let i = 0; i < 1 + T.botovi; i++) igraci.push(noviIgrac(i, i > 0));
  ja = igraci[0];
  const mesta = rasporedi(igraci.length, rnd);
  igraci.forEach((e, i) => bazu(e, mesta[i].x, mesta[i].y));
  vreme = 0; prljav = true; stanje = "igra"; lastTs = 0; priprema = 1.4;
  prebroj(); hud(); hideOverlay();
  window.SFX && SFX.whoosh();
}

/* ---------- kretanje ---------- */
function bezbedan(e, dx, dy) {
  const nx = e.x + dx, ny = e.y + dy;
  if (nx < 0 || ny < 0 || nx >= KOL || ny >= RED) return false;
  return tragV[idx(nx, ny)] !== e.id;        // u svoj trag se ne sme
}
function usmeri(e, dx, dy) {
  if (dx === -e.dx && dy === -e.dy) return false;   // nazad se ne okreće
  e.sled = { dx, dy };
  return true;
}
function napred(e) {
  if (e.sled && !(e.sled.dx === -e.dx && e.sled.dy === -e.dy)) { e.dx = e.sled.dx; e.dy = e.sled.dy; }
  e.sled = null;
  const nx = e.x + e.dx, ny = e.y + e.dy;
  if (nx < 0 || ny < 0 || nx >= KOL || ny >= RED) {   // ivica ne ubija — na njoj se staje dok ne skreneš
    if (e.bot) botOdluka(e);
    return;
  }
  const stara = { x: e.x, y: e.y };
  e.x = nx; e.y = ny;
  const i = idx(nx, ny);

  const nadje = tragV[i];                    // trag je slaba tačka: ko ga pregazi, ubija vlasnika
  if (nadje) {
    const zrtva = igraci[nadje - 1];
    pogini(zrtva, zrtva === e ? "svoj trag" : "presečen", e);
    if (!e.ziv) return;
  }
  if (vlas[i] === e.id) {
    if (e.trag.length) zauzmi(e);
  } else {
    if (!e.trag.length) e.dom = stara;       // odakle sam izašao — tu se vraćam
    tragV[i] = e.id; e.trag.push(i);
  }
  if (e.bot && e.ziv) botOdluka(e);
}
function korak(dt) {
  if (priprema > 0) { priprema -= dt; return; }   // svi mirno dok se ne vidi ko je gde
  vreme += dt;
  for (const e of igraci) {
    if (e.odmor > 0) e.odmor -= dt;
    if (!e.ziv) { if (e.ozivi > 0 && (e.ozivi -= dt) <= 0) ozivi(e); continue; }
    e.p += e.brzina * dt;
    let z = 0;
    while (e.p >= 1 && e.ziv && z++ < 4) { e.p -= 1; napred(e); }
    if (!e.ziv) e.p = 0;
  }
  sudar();
}
function sudar() {                            // glava u glavu: gine onaj ko nije na svome
  for (let a = 0; a < igraci.length; a++) {
    const A = igraci[a];
    if (!A.ziv) continue;
    for (let b = a + 1; b < igraci.length; b++) {
      const B = igraci[b];
      if (!B.ziv || A.x !== B.x || A.y !== B.y) continue;
      const i = idx(A.x, A.y);
      if (vlas[i] !== A.id) pogini(A, "sudar", B);
      if (vlas[i] !== B.id) pogini(B, "sudar", A);
    }
  }
}

/* ---------- zauzimanje: sve što je zatvoreno postaje moje ---------- */
function zauzmi(e) {
  for (const i of e.trag) { vlas[i] = e.id; tragV[i] = 0; }
  e.trag.length = 0; e.dom = null; e.meta = null;

  oznaka.fill(0);
  let sp = 0;
  const dodaj = (x, y) => {
    const i = idx(x, y);
    if (!oznaka[i] && vlas[i] !== e.id) { oznaka[i] = 1; stek[sp++] = i; }
  };
  for (let x = 0; x < KOL; x++) { dodaj(x, 0); dodaj(x, RED - 1); }
  for (let y = 0; y < RED; y++) { dodaj(0, y); dodaj(KOL - 1, y); }
  while (sp) {
    const i = stek[--sp], x = i % KOL, y = (i / KOL) | 0;
    if (x > 0) dodaj(x - 1, y);
    if (x < KOL - 1) dodaj(x + 1, y);
    if (y > 0) dodaj(x, y - 1);
    if (y < RED - 1) dodaj(x, y + 1);
  }
  let novo = 0;
  for (let i = 0; i < POLJA; i++) if (!oznaka[i] && vlas[i] !== e.id) { vlas[i] = e.id; novo++; }

  prljav = true;
  prebroj();
  if (e === ja) window.SFX && (novo > 60 ? SFX.coin() : SFX.tick());
  /* ko ostane bez ijednog polja — ispao je */
  for (const d of igraci) if (d.ziv && d !== e && d.polja === 0) pogini(d, "bez terena", e);
  if (e === ja && ja.pr >= cilj) return kraj(true);
  if (e !== ja && e.pr >= cilj) return kraj(false, "Protivnik je zauzeo " + Math.round(e.pr) + "% table.");
  hud();
}
function prebroj() {
  for (const e of igraci) e.polja = 0;
  for (let i = 0; i < POLJA; i++) { const v = vlas[i]; if (v) igraci[v - 1].polja++; }
  for (const e of igraci) e.pr = e.polja * 100 / POLJA;
}

/* ---------- smrt i povratak ---------- */
function pogini(e, razlog, krivac) {
  if (!e.ziv) return;
  e.ziv = false;
  for (const i of e.trag) if (tragV[i] === e.id) tragV[i] = 0;
  e.trag.length = 0; e.dom = null; e.meta = null;
  if (e.bot) {
    for (let i = 0; i < POLJA; i++) if (vlas[i] === e.id) vlas[i] = 0;
    e.ozivi = 3.5;
    prljav = true; prebroj(); hud();
    window.SFX && (krivac === ja ? SFX.good() : SFX.tick());
  } else {
    prljav = true; prebroj();
    kraj(false, razlog === "svoj trag" ? "Presekao si sam svoj trag." :
      razlog === "bez terena" ? "Ostao si bez ijednog polja." :
      razlog === "sudar" ? "Naleteo si na " + (krivac ? krivac.boja.nm : "protivnika") + " van svog terena." :
      (krivac ? "Presekao ti je trag " + krivac.boja.nm + "." : "Gotovo."));
  }
}
function ozivi(e) {
  if (stanje !== "igra") { e.ozivi = 1; return; }
  for (let pok = 0; pok < 80; pok++) {
    const x = 4 + ((Math.random() * (KOL - 8)) | 0), y = 4 + ((Math.random() * (RED - 8)) | 0);
    let slobodno = true;
    for (let j = -4; j <= 4 && slobodno; j++) for (let i = -4; i <= 4; i++)
      if (vlas[idx(clamp(x + i, 0, KOL - 1), clamp(y + j, 0, RED - 1))]) { slobodno = false; break; }
    if (!slobodno) continue;
    e.ziv = true; e.ozivi = 0; e.brzina = TEZINE[tez].brzina;
    bazu(e, x, y);
    prljav = true; prebroj(); hud();
    return;
  }
  e.ozivi = 2;                                 // nema mesta — proba ponovo malo kasnije
}

/* ---------- protivnici ---------- */
function usmeriKa(e, tx, ty) {
  const opcije = [];
  const rx = tx - e.x, ry = ty - e.y;
  if (rx) opcije.push({ dx: Math.sign(rx), dy: 0, w: Math.abs(rx) });
  if (ry) opcije.push({ dx: 0, dy: Math.sign(ry), w: Math.abs(ry) });
  opcije.sort((a, b) => b.w - a.w);
  for (const o of opcije) if (bezbedan(e, o.dx, o.dy) && usmeri(e, o.dx, o.dy)) return true;
  return skreni(e);
}
function skreni(e) {
  const bok = e.dx ? [{ dx: 0, dy: 1 }, { dx: 0, dy: -1 }] : [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }];
  if (Math.random() < .5) bok.reverse();
  for (const o of bok) if (bezbedan(e, o.dx, o.dy) && usmeri(e, o.dx, o.dy)) return true;
  if (bezbedan(e, e.dx, e.dy)) return false;   // pravo je i dalje u redu
  for (const o of [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }])
    if (bezbedan(e, o.dx, o.dy) && usmeri(e, o.dx, o.dy)) return true;
  return false;
}
function najbliziTrag(e, domet) {              // lov na tuđi trag — tako se protivnik obara
  let naj = null, najD = domet + 1;
  for (const d of igraci) {
    if (d === e || !d.ziv || d.trag.length < 4) continue;   // niko se ne čeka odmah pred kućom
    for (const i of d.trag) {
      const x = i % KOL, y = (i / KOL) | 0;
      const dist = Math.abs(x - e.x) + Math.abs(y - e.y);
      if (dist < najD) { najD = dist; naj = { x, y }; }
    }
  }
  return naj;
}
function botOdluka(e) {
  const T = TEZINE[tez];
  const naSvom = vlas[idx(e.x, e.y)] === e.id;

  if (!e.trag.length) {                        // kod kuće: bira sledeći izlet
    if (naSvom && vreme < STARTNI_MIR) {       // na početku niko ne juri — svako se vrti po svome
      const napolju = (dx, dy) => vlas[idx(clamp(e.x + dx, 0, KOL - 1), clamp(e.y + dy, 0, RED - 1))] !== e.id;
      if (!bezbedan(e, e.dx, e.dy) || napolju(e.dx, e.dy)) {
        for (const o of [{ dx: -e.dy, dy: e.dx }, { dx: e.dy, dy: -e.dx }, { dx: -e.dx, dy: -e.dy }])
          if (bezbedan(e, o.dx, o.dy) && !napolju(o.dx, o.dy) && usmeri(e, o.dx, o.dy)) return;
      }
      return;
    }
    if (naSvom) {
      if (T.agro && !e.meta && vreme > 12 && e.odmor <= 0) {
        e.meta = najbliziTrag(e, T.agro);
        if (e.meta) e.odmor = 8 + Math.random() * 8;         // posle lova malo miruje
      }
      if (e.meta) { usmeriKa(e, e.meta.x, e.meta.y); return; }
      e.dubina = T.dubina[0] + ((Math.random() * (T.dubina[1] - T.dubina[0] + 1)) | 0);
      if (!bezbedan(e, e.dx, e.dy) || zidBlizu(e, 3) || Math.random() < .12) skreni(e);
      return;
    }
  }
  if (e.meta) {                                // lovi dok trag postoji
    const i = idx(e.meta.x, e.meta.y);
    if (tragV[i]) { usmeriKa(e, e.meta.x, e.meta.y); return; }
    e.meta = null;
  }
  if (e.dom) {
    const daleko = Math.abs(e.x - e.dom.x) + Math.abs(e.y - e.dom.y) > T.domet;
    if (e.trag.length >= e.dubina || daleko) { usmeriKa(e, e.dom.x, e.dom.y); return; }
  }
  if (!bezbedan(e, e.dx, e.dy) || zidBlizu(e, 2)) { skreni(e); return; }
  if (Math.random() < .07) skreni(e);
}
function zidBlizu(e, n) {
  const nx = e.x + e.dx * n, ny = e.y + e.dy * n;
  return nx < 0 || ny < 0 || nx >= KOL || ny >= RED;
}

/* ---------- crtanje ----------
   Tabla je prevelika da bi stala u jedan keširani sloj (bilo bi desetine megabajta),
   pa se svaki kadar crtaju samo ćelije u prozoru — i to spajanjem uzastopnih ćelija
   iste boje u jedan pravougaonik, tako da ih ostane par stotina. Cela tabla se drži
   samo u mapici od jednog piksela po ćeliji, koja se osvežava kad se nešto zauzme. */
function crtajMapu() {
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.fillStyle = "#0a1120";
  mctx.fillRect(0, 0, KOL, RED);
  for (let y = 0; y < RED; y++) {
    let x = 0;
    while (x < KOL) {
      const v = vlas[idx(x, y)];
      if (!v) { x++; continue; }
      let k = x + 1;
      while (k < KOL && vlas[idx(k, y)] === v) k++;
      mctx.fillStyle = BOJE[v - 1].p;
      mctx.fillRect(x, y, k - x, 1);
      x = k;
    }
  }
}
function crtajTeren(x0, y0, x1, y1) {
  for (let y = y0; y < y1; y++) {
    let x = x0;
    while (x < x1) {
      const v = vlas[idx(x, y)];
      if (!v) { x++; continue; }
      let k = x + 1;
      while (k < x1 && vlas[idx(k, y)] === v) k++;
      ctx.fillStyle = BOJE[v - 1].p;
      ctx.fillRect(x, y, k - x, 1);
      x = k;
    }
  }
  ctx.fillStyle = "rgba(255,255,255,.28)";     // svetla ivica na vrhu svake mrlje
  for (let y = y0; y < y1; y++) {
    let x = x0;
    while (x < x1) {
      const v = vlas[idx(x, y)];
      if (!v || (y > 0 && vlas[idx(x, y - 1)] === v)) { x++; continue; }
      let k = x + 1;
      while (k < x1 && vlas[idx(k, y)] === v && !(y > 0 && vlas[idx(k, y - 1)] === v)) k++;
      ctx.fillRect(x, y, k - x, .16);
      x = k;
    }
  }
}
function ciljKamere() {
  if (!ja) return { x: 0, y: 0 };
  const cx = ja.x + ja.dx * ja.p + .5, cy = ja.y + ja.dy * ja.p + .5;
  return {
    x: clamp(cx - vidW / 2, 0, Math.max(0, KOL - vidW)),
    y: clamp(cy - vidH / 2, 0, Math.max(0, RED - vidH))
  };
}
function pomeriKameru(dt) {
  const c = ciljKamere();
  const k = dt > 0 ? Math.min(1, dt * 14) : 1;          // meko praćenje, bez trzanja
  kam.x += (c.x - kam.x) * k;
  kam.y += (c.y - kam.y) * k;
}
function mapa() {                              // cela tabla u uglu, sa prozorom i glavama
  const sirina = Math.round(Math.min(cv.width * .27, cv.height * .27 * KOL / RED));
  const visina = Math.round(sirina * RED / KOL);
  const pad = Math.round(PPC * .7);
  const mx = cv.width - sirina - pad, my = pad;
  ctx.save();
  ctx.fillStyle = "rgba(4,7,13,.82)";
  ctx.fillRect(mx - 3, my - 3, sirina + 6, visina + 6);
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = .95;
  ctx.drawImage(mapaCv, 0, 0, KOL, RED, mx, my, sirina, visina);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(238,242,249,.45)"; ctx.lineWidth = 1;
  ctx.strokeRect(mx - 2.5, my - 2.5, sirina + 5, visina + 5);
  const sx = sirina / KOL, sy = visina / RED;
  ctx.strokeStyle = "rgba(255,255,255,.8)";              // gde je prozor na tabli
  ctx.strokeRect(mx + kam.x * sx, my + kam.y * sy, vidW * sx, vidH * sy);
  for (const e of igraci) {                              // glave, da se vidi ko je gde
    if (!e.ziv) continue;
    ctx.fillStyle = e.boja.p;
    ctx.beginPath(); ctx.arc(mx + (e.x + .5) * sx, my + (e.y + .5) * sy, e === ja ? 2.8 : 2.1, 0, 7); ctx.fill();
    if (e === ja) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2; ctx.stroke(); }
  }
  ctx.restore();
}
function crtaj() {
  if (prljav) { crtajMapu(); prljav = false; }
  const ox = Math.round(clamp(kam.x, 0, Math.max(0, KOL - vidW)) * PPC);
  const oy = Math.round(clamp(kam.y, 0, Math.max(0, RED - vidH)) * PPC);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#06090f";                   // van table
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(PPC, 0, 0, PPC, -ox, -oy);  // dalje se crta u ćelijama

  const x0 = Math.max(0, Math.floor(ox / PPC)), y0 = Math.max(0, Math.floor(oy / PPC));
  const x1 = Math.min(KOL, Math.ceil((ox + cv.width) / PPC) + 1);
  const y1 = Math.min(RED, Math.ceil((oy + cv.height) / PPC) + 1);

  ctx.fillStyle = "#0a1120";                   // sama tabla
  ctx.fillRect(0, 0, KOL, RED);
  ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 1 / PPC;
  ctx.beginPath();
  for (let x = Math.ceil(x0 / 5) * 5; x < x1; x += 5) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
  for (let y = Math.ceil(y0 / 5) * 5; y < y1; y += 5) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
  ctx.stroke();

  crtajTeren(x0, y0, x1, y1);

  const opasno = ja && ja.ziv && ja.trag.length ? blizuMomTragu() : false;
  for (const e of igraci) {
    if (!e.ziv || !e.trag.length) continue;
    ctx.globalAlpha = .92;
    ctx.fillStyle = (e === ja && opasno)
      ? (Math.floor(performance.now() / 160) % 2 ? "#ff7b6c" : e.boja.t)   // trepće kad neko juri tvoj trag
      : e.boja.t;
    for (const i of e.trag) {
      const x = i % KOL, y = (i / KOL) | 0;
      if (x < x0 - 1 || x > x1 || y < y0 - 1 || y > y1) continue;
      ctx.fillRect(x, y, 1, 1);
    }
    const hx = e.x + e.dx * e.p, hy = e.y + e.dy * e.p;   // komad do glave, da linija ne skakuće
    ctx.fillRect(Math.min(e.x, hx), Math.min(e.y, hy), Math.abs(hx - e.x) + 1, Math.abs(hy - e.y) + 1);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = "rgba(159,176,204,.5)"; ctx.lineWidth = .3;
  ctx.strokeRect(-.15, -.15, KOL + .3, RED + .3);        // ivica table
  for (const e of igraci) {
    if (!e.ziv) continue;
    const px = e.x + e.dx * e.p + .5, py = e.y + e.dy * e.p + .5;
    if (px < x0 - 2 || px > x1 + 2 || py < y0 - 2 || py > y1 + 2) continue;
    if (e === ja) {
      ctx.beginPath(); ctx.arc(px, py, 1.8, 0, 7);
      ctx.fillStyle = "rgba(255,255,255,.14)"; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(px, py, 1.05, 0, 7);
    ctx.fillStyle = e.boja.p; ctx.fill();
    ctx.lineWidth = .18; ctx.strokeStyle = e === ja ? "#ffffff" : "rgba(255,255,255,.65)"; ctx.stroke();
    ctx.beginPath(); ctx.arc(px + e.dx * .5, py + e.dy * .5, .32, 0, 7);
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fill();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  mapa();
  if (priprema > 0 && stanje === "igra") {
    ctx.fillStyle = "rgba(238,242,249,.92)";
    ctx.font = "bold " + Math.round(PPC * 2.2) + "px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(priprema > .5 ? "Spremi se…" : "Kreni!", cv.width / 2, cv.height / 2);
    ctx.font = Math.round(PPC * 1.15) + "px system-ui, sans-serif";
    ctx.fillStyle = "rgba(159,176,204,.95)";
    ctx.fillText("cilj: " + cilj + "% cele table", cv.width / 2, cv.height / 2 + PPC * 2.2);
  }
}

let bioOpasno = false;
function blizuMomTragu() {                     // je li neko na šest polja od mog traga
  for (const e of igraci) {
    if (e === ja || !e.ziv) continue;
    for (const i of ja.trag) {
      const x = i % KOL, y = (i / KOL) | 0;
      if (Math.abs(e.x - x) + Math.abs(e.y - y) <= 6) {
        if (!bioOpasno) { bioOpasno = true; window.SFX && SFX.tick(); }
        return true;
      }
    }
  }
  bioOpasno = false;
  return false;
}

/* ---------- trka u dvoje ----------
   Oba telefona dobiju isti raspored i iste protivnike; mrežom ide samo napredak
   (koliko procenata ko drži), pa kašnjenje veze ne kvari igru. */
let trka = null;
const jaDomacin = () => trka && trka.uloga === "domacin";

function trkaMeni() {

  showOverlay('<h2>🏁 Trka u dvoje</h2>' +
    '<p>Oba telefona dobiju <b>istu tablu i iste protivnike</b>. Ko prvi stigne do cilja, dobija rundu; ' +
    'ako pogineš, protivnik dobija rundu kad stigne.</p>' +
    '<div class="btns"><button id="sobaBtn">🌐 Napravi sobu</button>' +
    '<button id="udjiBtn">🔗 Uđi u sobu</button>' +

  $("#sobaBtn").onclick = () => trkaSoba();
  $("#udjiBtn").onclick = trkaUdji;

}
function trkaKraj() {
  if (trka && trka.tajmer) clearInterval(trka.tajmer);

}
function noviTrkac(uloga) {
  if (trka && trka.tajmer) clearInterval(trka.tajmer);

}

function trkaUdji() {

    'style="font:inherit;color:#eef2f9;background:#1b2a4a;border:1px solid #283a5e;border-radius:10px;padding:9px 11px;width:190px;text-align:center;letter-spacing:5px;text-transform:uppercase">' +

function trkaStatus(st, detalj) {
  if (!trka) return;

  if (st === "cekam") {

      '<div style="font-size:30px;font-weight:700;letter-spacing:8px;color:#c9a227;background:#16223a;' +
      'border:1px solid #283a5e;border-radius:12px;padding:10px 16px">' + detalj + '</div>' +
      '<p>Reci kod drugom igraču — neka ga ukuca kod „Uđi u sobu“. Čekam…</p>' +

    if (jaDomacin()) izborTrke();
    else showOverlay('<h2>Povezani ste!</h2><p>' + Mreza.tudjeIme("Domaćin") + ' bira težinu…</p>');
  }
  if (st === "prekinuto") {
    if (stanje === "igra") stanje = "pauza";
    showOverlay('<h2>⚠️ Veza je prekinuta</h2><p>Protivnik je izašao ili je ostao bez signala.</p><button id="nbp">← Meni</button>');
    $("#nbp").onclick = () => { trkaKraj(); pocetak(); };
  }
  if (st === "greska") {
    showOverlay('<h2>Spajanje nije uspelo</h2><p>' + (detalj || "") + '</p>' +
      '<div class="btns"><button id="opetBtn2">↻ Probaj ponovo</button><button id="nazadBtn4">← Nazad</button></div>');
    $("#opetBtn2").onclick = () => { const f = trka && trka.ponovi; Mreza.zatvori(); if (f) f(); };
    $("#nazadBtn4").onclick = () => { trkaKraj(); trkaMeni(); };
  }
}
function izborTrke() {                         // domaćin bira težinu za sledeću rundu
  stanje = "meni";
  let h = '<h2>Runda ' + (trka.poeni[0] + trka.poeni[1] + 1) + '</h2>' +
    '<p>Rezultat: <b style="color:#eef2f9">' + trka.poeni[0] + " : " + trka.poeni[1] + '</b></p><div class="tez">';
  for (const k of ["lako", "srednje", "tesko"]) {
    const t = TEZINE[k];
    h += '<button data-t="' + k + '"' + (k === trka.tez ? ' style="border-color:#c9a227"' : '') + '>' +
      '<span>' + t.nm + '<small><br>' + t.opis + ' · cilj ' + t.cilj + '%</small></span></button>';
  }
  h += '</div><div class="btns"><button id="krenBtn">▶ Kreni</button><button id="prekiniBtn">✖ Prekini trku</button></div>';
  showOverlay(h);
  for (const b of document.querySelectorAll(".tez button"))
    b.onclick = () => { trka.tez = b.dataset.t; izborTrke(); };
  $("#krenBtn").onclick = () => {
    const seme = (Math.random() * 2 ** 31) | 0;
    Mreza.posalji({ t: "kreni", seme, tez: trka.tez });
    pocniRundu(seme, trka.tez);
  };
  $("#prekiniBtn").onclick = () => { trkaKraj(); pocetak(); };
}
function pocniRundu(seme, tezina) {
  trka.moj = praznaStrana(); trka.prot = praznaStrana(); trka.tez = tezina;
  nova(seme, tezina);
  trka.t0 = performance.now();
  hud();
}
function trkaStigao() {
  trka.moj.stigao = true; trka.moj.vreme = performance.now() - trka.t0; trka.moj.pr = ja.pr;
  stanje = "ceka"; window.SFX && SFX.win();
  Mreza.posalji({ t: "stigao", vreme: Math.round(trka.moj.vreme) });
  if (jaDomacin()) mozdaKrajRunde();
  else showOverlay('<h2>🏁 Stigao si do ' + cilj + '%</h2><p>Za ' + mmss(trka.moj.vreme / 1000) + '. Čekam protivnika…</p>');
}
function trkaIspao() {
  trka.moj.pao = true; trka.moj.pr = ja.pr;
  stanje = "ceka"; window.SFX && SFX.siren();
  Mreza.posalji({ t: "pao", pr: Math.round(ja.pr * 10) / 10 });
  if (jaDomacin()) mozdaKrajRunde();
  else showOverlay('<h2>💥 Gotov si</h2><p>Držao si ' + ja.pr.toFixed(1) + '%. Čekam protivnika…</p>');
}
function mozdaKrajRunde() {
  if (!trka || !jaDomacin()) return;
  const a = trka.moj, b = trka.prot;
  if (!((a.stigao || a.pao) && (b.stigao || b.pao))) {
    if (!$("#overlay").hidden) return;
    showOverlay('<h2>' + (a.stigao ? "🏁 Stigao si do cilja" : "💥 Gotov si") + '</h2><p>Čekam protivnika…</p>');
    return;
  }
  let pobednik = null;
  if (a.stigao && b.stigao) pobednik = a.vreme <= b.vreme ? 0 : 1;
  else if (a.stigao) pobednik = 0;
  else if (b.stigao) pobednik = 1;
  else pobednik = a.pr === b.pr ? null : (a.pr > b.pr ? 0 : 1);      // oba pala — više terena nosi rundu
  if (pobednik === 0) trka.poeni[0]++; else if (pobednik === 1) trka.poeni[1]++;
  const izv = {
    t: "runda", pobednik, poeni: trka.poeni.slice(),
    vremeD: a.stigao ? Math.round(a.vreme) : 0, vremeG: b.stigao ? Math.round(b.vreme) : 0,
    prD: Math.round(a.pr * 10) / 10, prG: Math.round(b.pr * 10) / 10
  };
  Mreza.posalji(izv);
  prikaziRundu(izv, 0);
}
function prikaziRundu(m, jaSam) {
  stanje = "kraj";
  trka.poeni = m.poeni.slice();
  const mojeV = jaSam === 0 ? m.vremeD : m.vremeG, tudjeV = jaSam === 0 ? m.vremeG : m.vremeD;
  const mojPr = jaSam === 0 ? m.prD : m.prG, tudjPr = jaSam === 0 ? m.prG : m.prD;
  const pobedio = m.pobednik === jaSam;
  window.SFX && (pobedio ? SFX.jackpot() : SFX.siren());
  showOverlay('<h2>' + (m.pobednik == null ? "Nerešeno" : pobedio ? "🏆 Dobio si rundu!" : "Protivnik je dobio rundu") + '</h2>' +
    '<div class="res"><span>' + ((window.IGRAC && IGRAC.ime()) || "Ti") + '</span><b>' +
    (mojeV ? mmss(mojeV / 1000) : mojPr + "%") + '</b>' +
    '<span>' + Mreza.tudjeIme() + '</span><b>' + (tudjeV ? mmss(tudjeV / 1000) : tudjPr + "%") + '</b>' +
    '<span>Rezultat</span><b>' + m.poeni[jaSam] + " : " + m.poeni[1 - jaSam] + '</b></div>' +
    '<div class="btns">' + (jaSam === 0 ? '<button id="daljeBtn">▶ Sledeća runda</button>' : '') +
    '<button id="krajTrke">✖ Prekini trku</button></div>' +
    (jaSam === 0 ? "" : '<p>Domaćin bira sledeću rundu…</p>'));
  const db = $("#daljeBtn"); if (db) db.onclick = izborTrke;
  $("#krajTrke").onclick = () => { trkaKraj(); pocetak(); };
  hud();
}
function trkaPrimi(m, od) {
  if (window.CET && CET.primi(m, od)) return;
  if (!trka || !m) return;
  if (m.t === "kreni") return pocniRundu(m.seme, m.tez);
  if (m.t === "napredak") { trka.prot.pr = m.pr; hud(); return; }
  if (m.t === "stigao") {
    trka.prot.stigao = true; trka.prot.vreme = m.vreme; hud();
    if (jaDomacin()) mozdaKrajRunde();
    return;
  }
  if (m.t === "pao") {
    trka.prot.pao = true; trka.prot.pr = m.pr; hud();
    if (jaDomacin()) mozdaKrajRunde();
    return;
  }
  if (m.t === "runda") return prikaziRundu(m, 1);
}

/* ---------- ulaz ---------- */
const SMER = { l: { dx: -1, dy: 0 }, r: { dx: 1, dy: 0 }, u: { dx: 0, dy: -1 }, d: { dx: 0, dy: 1 } };
function vozi(k) {
  if (stanje !== "igra" || !ja || !ja.ziv) return;
  const s = SMER[k];
  if (s && usmeri(ja, s.dx, s.dy)) window.SFX && SFX.tick();
}
for (const b of document.querySelectorAll(".tipke button"))
  b.addEventListener("click", () => vozi(b.dataset.s));

let poc = null;
cv.addEventListener("pointerdown", e => {
  if (stanje !== "igra") return;
  cv.setPointerCapture(e.pointerId);
  poc = { x: e.clientX, y: e.clientY };
});
cv.addEventListener("pointermove", e => {
  if (!poc || stanje !== "igra") return;
  const dx = e.clientX - poc.x, dy = e.clientY - poc.y;
  const prag = 14;
  if (Math.abs(dx) < prag && Math.abs(dy) < prag) return;
  vozi(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u"));
  poc = { x: e.clientX, y: e.clientY };            // prevlačenje dalje odmah menja smer
});
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) cv.addEventListener(ev, () => poc = null);

document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a") { vozi("l"); e.preventDefault(); }
  else if (k === "ArrowRight" || k === "d") { vozi("r"); e.preventDefault(); }
  else if (k === "ArrowUp" || k === "w") { vozi("u"); e.preventDefault(); }
  else if (k === "ArrowDown" || k === "s") { vozi("d"); e.preventDefault(); }
  else if (k === "p" || k === "P") pauza();
});
$("#bPause").onclick = pauza;
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) { }
};
document.addEventListener("visibilitychange", () => { if (document.hidden && stanje === "igra") pauza(); });

/* ---------- petlja i veličina ---------- */
function loop(ts) {
  raf = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(.05, (ts - lastTs) / 1000); lastTs = ts;
  if (stanje === "igra") {
    korak(dt);
    if (ts - hudTs > 250) { hudTs = ts; hud(); }
  }
  pomeriKameru(stanje === "igra" && priprema <= 0 ? dt : 0);
  crtaj();
}
function fit() {
  const wrap = document.querySelector(".wrap"), nav = document.querySelector(".gamenav"), stage = document.querySelector(".stage");
  const limit = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  const kids = [...wrap.children].filter(el => el.offsetParent !== null);
  const others = kids.filter(el => el !== stage).reduce((a, el) => a + el.getBoundingClientRect().height, 0);
  const cs = getComputedStyle(wrap);
  const gaps = (parseFloat(cs.rowGap) || 0) * Math.max(0, kids.length - 1);
  const availH = limit - wrap.getBoundingClientRect().top - others - gaps - (parseFloat(cs.paddingBottom) || 0) - 12;
  const availW = Math.min(window.innerWidth - 20, 460);
  const w = Math.max(150, Math.floor(availW));
  const h = Math.max(200, Math.floor(availH));
  cv.style.width = w + "px"; cv.style.height = h + "px";
  /* Platno mora da ima onoliko pravih piksela koliko ga ekran zaista crta —
     inače je slika mutna na gustim ekranima. */
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  PPC = Math.max(5, Math.round(cv.width / VID_KOL));       // pravih piksela po ćeliji
  vidW = Math.min(KOL, cv.width / PPC);
  vidH = Math.min(RED, cv.height / PPC);
  const c = ciljKamere(); kam.x = c.x; kam.y = c.y;
  prljav = true;
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 150));
window.addEventListener("load", fit);

/* ---------- start ---------- */
try { const t = localStorage.getItem(THEME_KEY); if (t) document.body.dataset.theme = t; } catch (e) { }
ucitaj();
nova(1, tez);                   // tabla se vidi iza menija
stanje = "meni";
fit(); crtaj(); pocetak();
raf = requestAnimationFrame(loop);

window.T = {
  KOL, RED, POLJA, TEZINE, BOJE, VID_KOL,
  get PPC() { return PPC; }, get vidW() { return vidW; }, get vidH() { return vidH; }, get kam() { return kam; },
  ciljKamere, pomeriKameru,
  get stanje() { return stanje; }, set stanje(v) { stanje = v; },
  get igraci() { return igraci; }, get ja() { return ja; }, get vlas() { return vlas; },
  get trag() { return tragV; }, get cilj() { return cilj; }, get tez() { return tez; },
  get vreme() { return vreme; }, get rekordi() { return rekordi; }, get trka() { return trka; },
  idx, nova, korak, napred, zauzmi, pogini, ozivi, prebroj, botOdluka, usmeri, vozi,
  get priprema() { return priprema; }, set priprema(v) { priprema = v; },
  pocetak, izborTezine, pauza, trkaMeni, trkaKraj, hud, kraj,
  vrti: (dt, n) => { for (let i = 0; i < n; i++) korak(dt); },
  postavi: (e, x, y, dx, dy) => { e.x = x; e.y = y; e.dx = dx; e.dy = dy; e.p = 0; }
};
</script>
