<style>
  :root {
    color-scheme: dark;
    --bg: #0e1626; --panel: #16223a; --panel-2: #1b2a4a;
    --ink: #eef2f9; --ink-dim: #9fb0cc; --line: #283a5e;
    --gold: #c9a227; --good: #2e9e6b; --bad: #d65a4e;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f2f4f8; --panel: #ffffff; --panel-2: #eef1f7;
    --ink: #1b2a4a; --ink-dim: #5a6884; --line: #d7dded;
    --gold: #a9851a; --good: #1f7d52; --bad: #c0473c;
    --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Calibri, "Segoe UI", system-ui, sans-serif;

  }
  button { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; cursor: pointer;
    touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  @media (hover: hover) { button:hover { border-color: var(--gold); } }

  .wrap { display: flex; flex-direction: column; align-items: center; gap: 7px;
          min-height: 100dvh; padding: 6px 10px 8px; }
  .col { width: min(100vw - 20px, 460px); }

           border-left: 4px solid var(--gold); padding: 3px 0 3px 10px; }

  header .sub { color: var(--ink-dim); font-size: 12px; }

  .hud { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-dim);
         white-space: nowrap; overflow: hidden; }

  .hud b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }

  .cip.pao { opacity: .35; }
  @media (max-width: 360px) { .hud { font-size: 11.5px; gap: 5px; } }
  #hProt:not(:empty) { color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 999px; padding: 1px 8px; }

  .stage { position: relative; }
  canvas { display: block; border: 1px solid var(--line); border-radius: 12px;
           background: #0a1120; box-shadow: var(--shadow); touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
             align-items: center; justify-content: center; text-align: center; padding: 16px;
             background: rgba(8,14,26,.92); backdrop-filter: blur(3px); border-radius: 12px; z-index: 5;
             color: #eef2f9; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; font-size: 13px; color: #9fb0cc; max-width: 300px; }
  .overlay ul { margin: 0; padding-left: 18px; text-align: left; font-size: 13px; color: #9fb0cc; max-width: 300px; }
  .overlay ul li { margin-bottom: 5px; }
  .overlay .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .overlay .res { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 14px; color: #9fb0cc; }
  .overlay .res b { color: #eef2f9; font-variant-numeric: tabular-nums; }
  .overlay button { background: #16223a; color: #eef2f9; border-color: #283a5e; }
  .overlay .mesta { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 280px;
                    font-size: 13.5px; color: #eef2f9; }
  .overlay .mesto { display: flex; align-items: center; gap: 7px; background: #16223a;
                    border: 1px solid #283a5e; border-radius: 9px; padding: 5px 9px; }
  .overlay .mesto i { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .overlay .mesto small { color: #9fb0cc; }
  .overlay .mesto.prazno { color: #9fb0cc; border-style: dashed; justify-content: center; font-size: 12.5px; }
  .overlay .res span i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .overlay .tez { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 260px; }
  .overlay .tez button { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; }
  .overlay .tez small { color: #9fb0cc; font-size: 11.5px; font-weight: 400; }

  .tipke { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  @media (max-height: 780px) { .foot { display: none; } }

  @media (max-height: 600px) { header h1 { font-size: 15px; } .wrap { gap: 5px; }
                               .tipke button { font-size: 17px; padding: 6px 0; } .tipke button b { display: none; } }
  @media (orientation: landscape) and (max-height: 520px) {
    header .sub, .foot { display: none; }
    header { padding: 0 0 0 10px; } header h1 { font-size: 15px; }
    .wrap { gap: 4px; padding: 3px 10px 5px; }
  }

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "teren.v1", THEME_KEY = "sudoku.theme";

/* ---------- tabla ----------
   Tabla je mnogo veća od ekrana: ekran je prozor koji prati igrača, a ceo teren se
   vidi na mapici u uglu. Vlasništvo i tragovi stoje u ravnim nizovima, po ćeliji
   jedan bajt. */
const KOL = 132, RED = 180, POLJA = KOL * RED;
const VID_KOL = 38;                            // koliko ćelija stane preko ekrana
const cv = $("#cv"), ctx = cv.getContext("2d");
const mapaCv = document.createElement("canvas");    // cela tabla, jedan piksel po ćeliji
const mctx = mapaCv.getContext("2d");
mapaCv.width = KOL; mapaCv.height = RED;
let PPC = 10;                                  // pravih piksela po ćeliji
let vidW = VID_KOL, vidH = 50;                 // koliko ćelija se vidi
const kam = { x: 0, y: 0 };                    // gornji levi ugao prozora, u ćelijama

const TEZINE = {
  lako:    { nm: "Lako",    opis: "tri protivnika, ne love",   botovi: 3, brzina: 6.4, agro: 0,  dubina: [7, 16],  domet: 18 },
  srednje: { nm: "Srednje", opis: "četiri, gledaju tuđi trag", botovi: 4, brzina: 7.4, agro: 12, dubina: [9, 20],  domet: 24 },
  tesko:   { nm: "Teško",   opis: "šest, brzi su i love te",   botovi: 6, brzina: 8.1, agro: 18, dubina: [10, 24], domet: 30 }
};
const CILJEVI = [25, 40, 50, 60];              // koliko table treba zauzeti za pobedu

/* Skriveni dragulji: vide se tek kad im priđeš, a nose kratku prednost. */
const BONUS = [
  { k: "stit",  em: "🛡", nm: "štit",  opis: "deset sekundi te niko ne može oboriti", boja: "#7fd7ff", traje: 10 },
  { k: "brzo",  em: "⚡", nm: "brzina", opis: "deset sekundi ideš brže",              boja: "#ffd24a", traje: 10 },
  { k: "led",   em: "❄",  nm: "led",    opis: "protivnici uspore na osam sekundi",     boja: "#a6ecff", traje: 8 },
  { k: "teren", em: "💎", nm: "dragulj", opis: "parče terena ti odmah pripadne",       boja: "#b9f27c", traje: 0 }
];
const MAX_BONUSA = 6, VIDI_BONUS = 14;
const BRZINA_JA = 7.8;
const STARTNI_MIR = 6;                         // sekundi koliko protivnici ostaju na svom terenu
const BOJE = [
  { p: "#c9a227", t: "#f5da7a", nm: "ti" },
  { p: "#d65a4e", t: "#f5a79e", nm: "crveni" },
  { p: "#3f8fd6", t: "#a0cbef", nm: "plavi" },
  { p: "#2e9e6b", t: "#8adcb4", nm: "zeleni" },
  { p: "#9a6bd6", t: "#c9aaf0", nm: "ljubičasti" },
  { p: "#d98324", t: "#f3c188", nm: "narandžasti" },
  { p: "#2ba6a6", t: "#8ad9d9", nm: "tirkizni" }
];

const idx = (x, y) => y * KOL + x;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const vlas = new Uint8Array(POLJA);        // 0 = ničije, inače id igrača
const tragV = new Uint8Array(POLJA);       // čiji trag leži na polju
const oznaka = new Uint8Array(POLJA);      // radna, za plavljenje
const stek = new Int32Array(POLJA);

let igraci = [], ja = null, mojIndex = 0;
let stanje = "meni";                       // meni | igra | pauza | kraj | ceka
let tez = "srednje", cilj = 40, vreme = 0, raf = null, lastTs = 0, prljav = true;
let bonusi = [], sledeciBonus = 5;         // dragulji na tabli i vreme do sledećeg
let priprema = 0;                              // kratak predah pre nego što krene
let rekordi = {};                          // po težini: {pr, vreme}

/* ---------- rekordi ---------- */
function ucitaj() { try { rekordi = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { rekordi = {}; } }
function upisi() { try { localStorage.setItem(KEY, JSON.stringify(rekordi)); } catch (e) { } }
function zapamtiRezultat(pr, sek, pobeda) {
  const r = rekordi[tez] || { pr: 0, vremena: {} };
  if (!r.vremena) r.vremena = {};
  if (pr > (r.pr || 0)) r.pr = Math.round(pr);
  if (pobeda && (!r.vremena[cilj] || sek < r.vremena[cilj])) r.vremena[cilj] = Math.round(sek);
  rekordi[tez] = r;
  rekordi.izbor = { tez, cilj };
  upisi();
}
function najboljeVreme(t, c) {
  const r = rekordi[t];
  return (r && r.vremena && r.vremena[c]) || 0;
}
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

/* ---------- nova partija ---------- */
function noviIgrac(i, bot, ime, mrezaId) {
  return {
    id: i + 1, boja: BOJE[i], bot: bot, ime: ime || "", mrezaId: mrezaId || "",
    x: 0, y: 0, dx: 0, dy: -1, p: 0, sled: null,
    trag: [], dom: null, meta: null, dubina: 8, ziv: true, ozivi: 0, odmor: 0,
    stit: 0, brzo: 0, usporen: 0,
    brzina: bot ? TEZINE[tez].brzina : BRZINA_JA,
    polja: 0, pr: 0
  };
}
const imeIgraca = e => e.ime || (e.bot ? "protivnik (" + e.boja.nm + ")" : "igrač");
const brzinaOd = e => e.brzina * (e.brzo > 0 ? 1.45 : 1) * (e.usporen > 0 ? .6 : 1);
const sudim = () => rezim !== "gost";          // domaćin i igra za jednog sude sami sebi
function bazu(e, x, y) {
  e.x = clamp(x, 4, KOL - 5); e.y = clamp(y, 4, RED - 5);
  for (let j = -3; j <= 3; j++) for (let i = -3; i <= 3; i++) vlas[idx(e.x + i, e.y + j)] = e.id;
  e.dx = 0; e.dy = e.y > RED / 2 ? -1 : 1; e.p = 0; e.trag.length = 0; e.dom = null; e.meta = null;
}
function rasporedi(n, rnd) {                 // svako dobije svoj ugao table, isto na oba telefona
  const a0 = rnd() * Math.PI * 2, out = [];
  for (let i = 0; i < n; i++) {
    const a = a0 + i * 2 * Math.PI / n;
    const r = .62 + rnd() * .28;               // ne svi na istom krugu, ali svako u svom pravcu
    out.push({ x: Math.round(KOL / 2 + Math.cos(a) * (KOL / 2 - 8) * r), y: Math.round(RED / 2 + Math.sin(a) * (RED / 2 - 10) * r) });
  }
  return out;
}
function nova(seme, tezina, ljudi, ciljPr) {
  if (tezina) tez = tezina;
  if (ciljPr) cilj = ciljPr;
  const T = TEZINE[tez];
  const rnd = mulberry32(seme | 0);
  vlas.fill(0); tragV.fill(0);
  igraci = [];
  const ljudiN = ljudi && ljudi.length ? ljudi.length : 1;
  for (let i = 0; i < ljudiN; i++) {
    const l = ljudi ? ljudi[i] : null;
    igraci.push(noviIgrac(i, false, l ? l.ime : "", l ? l.id : ""));
  }
  const botova = Math.max(0, T.botovi - (ljudiN - 1));       // ljudi popunjavaju tablu umesto botova
  for (let i = 0; i < botova && igraci.length < BOJE.length; i++) igraci.push(noviIgrac(igraci.length, true));
  mojIndex = ljudi ? Math.max(0, ljudi.findIndex(l => l.id === (window.Mreza ? Mreza.jaSam() : ""))) : 0;
  ja = igraci[mojIndex];
  const mesta = rasporedi(igraci.length, rnd);
  igraci.forEach((e, i) => bazu(e, mesta[i].x, mesta[i].y));
  bonusi = []; sledeciBonus = 5;
  vreme = 0; prljav = true; stanje = "igra"; lastTs = 0; priprema = 1.4;
  prebroj(); hud(); hideOverlay();
  window.SFX && SFX.whoosh();
}

/* ---------- skriveni dragulji ---------- */
function spustiBonus() {
  /* Dragulj pada u okolinu nekog igrača — dovoljno daleko da se ne dobije badava,
     dovoljno blizu da se na njega naiđe dok se kruži. */
  const zivi = igraci.filter(e => e.ziv);
  for (let pok = 0; pok < 200; pok++) {
    let x, y;
    if (zivi.length && pok < 160) {
      const c = zivi[(Math.random() * zivi.length) | 0];
      const ug = Math.random() * Math.PI * 2, d = 12 + Math.random() * 14;
      x = Math.round(c.x + Math.cos(ug) * d); y = Math.round(c.y + Math.sin(ug) * d);
    } else {
      x = 3 + ((Math.random() * (KOL - 6)) | 0); y = 3 + ((Math.random() * (RED - 6)) | 0);
    }
    if (x < 2 || y < 2 || x >= KOL - 2 || y >= RED - 2) continue;
    const i = idx(x, y);
    if (vlas[i] || tragV[i]) continue;
    let blizu = false;
    for (const e of igraci) if (e.ziv && Math.abs(e.x - x) + Math.abs(e.y - y) < 9) { blizu = true; break; }
    if (blizu) continue;
    if (bonusi.some(b => Math.abs(b.x - x) + Math.abs(b.y - y) < 10)) continue;
    bonusi.push({ v: (Math.random() * BONUS.length) | 0, x, y });
    return true;
  }
  return false;
}
function uzmiBonus(e, v) {                     // isto se izvršava i kod domaćina i kod gostiju
  const B = BONUS[v];
  if (!B) return;
  if (B.k === "stit") e.stit = B.traje;
  else if (B.k === "brzo") e.brzo = B.traje;
  else if (B.k === "led") { for (const d of igraci) if (d !== e) d.usporen = B.traje; }
  else if (B.k === "teren") {
    const R = 6, cel = [];
    for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
      if (i * i + j * j > R * R) continue;
      const x = e.x + i, y = e.y + j;
      if (x < 0 || y < 0 || x >= KOL || y >= RED) continue;
      cel.push(idx(x, y));
    }
    zauzmiPolja(e, cel);
  }
  if (e === ja) {
    window.SFX && SFX.jackpot();
    javi(B.em + " " + B.nm + " — " + B.opis);
  } else if (window.SFX) SFX.coin();
  hud();
}
let javnoDo = 0, javnoTekst = "";
function javi(t) { javnoTekst = t; javnoDo = performance.now() + 2600; }

/* ---------- kretanje ---------- */
function bezbedan(e, dx, dy) {
  const nx = e.x + dx, ny = e.y + dy;
  if (nx < 0 || ny < 0 || nx >= KOL || ny >= RED) return false;
  return tragV[idx(nx, ny)] !== e.id;        // u svoj trag se ne sme
}
function usmeri(e, dx, dy) {
  if (dx === -e.dx && dy === -e.dy) return false;   // nazad se ne okreće
  e.sled = { dx, dy };
  return true;
}
function napred(e) {
  if (e.sled && !(e.sled.dx === -e.dx && e.sled.dy === -e.dy)) { e.dx = e.sled.dx; e.dy = e.sled.dy; }
  e.sled = null;
  const nx = e.x + e.dx, ny = e.y + e.dy;
  if (nx < 0 || ny < 0 || nx >= KOL || ny >= RED) {   // ivica ne ubija — na njoj se staje dok ne skreneš
    if (e.bot) botOdluka(e);
    return;
  }
  const stara = { x: e.x, y: e.y };
  e.x = nx; e.y = ny;
  const i = idx(nx, ny);

  const nadje = tragV[i];                    // trag je slaba tačka: ko ga pregazi, ubija vlasnika
  if (nadje) {
    const zrtva = igraci[nadje - 1];
    pogini(zrtva, zrtva === e ? "svoj trag" : "presečen", e);
    if (!e.ziv) return;
  }
  if (vlas[i] === e.id) {
    if (e.trag.length) zauzmi(e);
  } else {
    if (!e.trag.length) e.dom = stara;       // odakle sam izašao — tu se vraćam
    tragV[i] = e.id; e.trag.push(i);
  }
  if (e.ziv && bonusi.length && sudim()) {   // dragulj se kupi gaženjem
    const bi = bonusi.findIndex(b => Math.abs(b.x - e.x) <= 1 && Math.abs(b.y - e.y) <= 1);   // dovoljno je proći pored
    if (bi >= 0) {
      const b = bonusi[bi];
      bonusi.splice(bi, 1);
      sobaSalji({ t: "B", i: igraci.indexOf(e), v: b.v });
      uzmiBonus(e, b.v);
    }
  }
  if (e.bot && e.ziv) botOdluka(e);
}
function korak(dt) {
  if (priprema > 0) { priprema -= dt; return; }   // svi mirno dok se ne vidi ko je gde
  vreme += dt;
  for (const e of igraci) {

const pisiPr = v => (v < 10 ? v.toFixed(1) : Math.round(v)) + "%";
function hud() {
  $("#hMoje").textContent = pisiPr(ja ? ja.pr : 0);
  $("#hCilj").textContent = cilj + "%";
  $("#hVreme").textContent = mmss(vreme);
  const protiv = igraci.filter(e => e !== ja).sort((a, b) => (b.ziv - a.ziv) || (b.pr - a.pr));
  const zivih = protiv.filter(e => e.ziv).length;
  let h = "";
  const koliko = Math.min(2, protiv.length);
  for (const e of protiv.slice(0, koliko)) {
    h += '<span class="cip' + (e.ziv ? "" : " pao") + '"><i style="background:' + e.boja.p + '"></i>' +
      (e.ziv ? Math.round(e.pr) + "%" : "✖") + '</span>';
  }
  if (protiv.length > koliko) h += '<span class="cip">+' + Math.max(0, zivih - koliko) + '</span>';
  $("#hBotovi").innerHTML = h;
  let d = "";
  if (ja && ja.stit > 0) d += "🛡" + Math.ceil(ja.stit) + " ";
  if (ja && ja.brzo > 0) d += "⚡" + Math.ceil(ja.brzo) + " ";
  if (ja && ja.usporen > 0) d += "🐢" + Math.ceil(ja.usporen) + " ";
  $("#hProt").textContent = d.trim();
}

/* ---------- kraj partije ---------- */
function kraj(pobeda, razlog, pobednik) {
  if (stanje === "kraj" || stanje === "ceka") return;
  stanje = "kraj";
  const pr = ja ? ja.pr : 0;
  if (rezim !== "sam") return krajUSobi(pobeda, razlog, pobednik);
  {
    zapamtiRezultat(pr, vreme, pobeda);
    window.SFX && (pobeda ? SFX.jackpot() : SFX.siren());
    const r = rekordi[tez] || {};
    const najb = najboljeVreme(tez, cilj);
    showOverlay('<h2>' + (pobeda ? "🏆 Osvojio si " + cilj + "% table!" : "💥 Kraj") + '</h2>' +
      (pobeda ? "" : '<p>' + (razlog || "") + '</p>') +
      '<div class="res"><span>Tvoj teren</span><b>' + pr.toFixed(1) + '%</b>' +
      '<span>Vreme</span><b>' + mmss(vreme) + '</b>' +
      '<span>Najbolje (' + TEZINE[tez].nm + ')</span><b>' + (r.pr || 0) + '%' +
      (najb ? " · " + mmss(najb) : "") + '</b></div>' +
      '<div class="btns"><button id="opetBtn">⟲ Još jednom</button>' +
      '<button id="tezBtn">⚙︎ Težina</button><button id="meniBtn">← Meni</button></div>');
    $("#opetBtn").onclick = () => nova((Math.random() * 2 ** 31) | 0);
    $("#tezBtn").onclick = izborTezine;
    $("#meniBtn").onclick = pocetak;
  }
}

/* ---------- meni ---------- */
function showOverlay(h) { const o = $("#overlay"); o.innerHTML = h; o.hidden = false; }
function hideOverlay() { $("#overlay").hidden = true; }

function pocetak() {
  stanje = "meni";
  rezim = "sam";
  const r = rekordi[tez] || {};
  showOverlay('<h2>🟩 Teren</h2>' +
    '<p>Izađi iz svoje boje, napravi krug i vrati se — sve unutra postaje tvoje. ' +
    'Dok si napolju, tvoj trag je slaba tačka.</p>' +
    '<p>Tabla je <b>mnogo veća od ekrana</b> — ekran te prati, a cela tabla i svi ' +
    'protivnici se vide na <b>mapici u desnom uglu</b>.</p>' +
    '<p>Težina: <b style="color:#eef2f9">' + TEZINE[tez].nm + '</b> · cilj: <b style="color:#eef2f9">' + cilj + '%</b>' +
    (r.pr ? ' · najbolje <b style="color:#eef2f9">' + r.pr + '%</b>' : '') +
    (najboljeVreme(tez, cilj) ? ' za <b style="color:#eef2f9">' + mmss(najboljeVreme(tez, cilj)) + '</b>' : '') + '</p>' +
    '<div class="btns"><button id="igrajBtn">▶ Igraj</button>' +
    '<button id="tezBtn2">⚙︎ Težina</button>' +
    '<button id="ciljBtn">🎯 Cilj ' + cilj + '%</button>' +
    '<button id="sobaBtn2">🌐 Igra u sobi</button>' +
    '<button id="pravBtn">❔ Pravila</button></div>');
  $("#igrajBtn").onclick = () => nova((Math.random() * 2 ** 31) | 0);
  $("#tezBtn2").onclick = izborTezine;
  $("#ciljBtn").onclick = izborCilja;
  $("#sobaBtn2").onclick = sobaMeni;
  $("#pravBtn").onclick = () => window.PRAVILA_IGRE && PRAVILA_IGRE.pokazi("teren");
}
function izborTezine() {
  stanje = "meni";
  let h = '<h2>⚙︎ Težina</h2><div class="tez">';
  for (const k of ["lako", "srednje", "tesko"]) {
    const t = TEZINE[k], r = rekordi[k] || {};
    h += '<button data-t="' + k + '"' + (k === tez ? ' style="border-color:#c9a227"' : '') + '>' +
      '<span>' + t.nm + '<small><br>' + t.opis + '</small></span>' +
      '<small>' + (r.pr ? r.pr + "%" : "—") + '</small></button>';
  }
  h += '</div><div class="btns"><button id="nazadBtn">← Nazad</button></div>';
  showOverlay(h);
  for (const b of document.querySelectorAll(".tez button"))
    b.onclick = () => { tez = b.dataset.t; rekordi.izbor = { tez, cilj }; upisi(); window.SFX && SFX.tap(); pocetak(); };
  $("#nazadBtn").onclick = pocetak;
}
function izborCilja() {
  stanje = "meni";
  let h = '<h2>🎯 Koliko table treba osvojiti</h2><p>Pobednik je ko prvi dođe do tog dela table.</p><div class="tez">';
  for (const c of CILJEVI) {
    const v = najboljeVreme(tez, c);
    h += '<button data-c="' + c + '"' + (c === cilj ? ' style="border-color:#c9a227"' : '') + '>' +
      '<span>' + c + '%<small><br>' + (c <= 25 ? "kratka partija" : c === 40 ? "taman za jednu vožnju" : c === 50 ? "duža partija" : "cela tabla je tvoja") + '</small></span>' +
      '<small>' + (v ? mmss(v) : "—") + '</small></button>';
  }
  h += '</div><div class="btns"><button id="nazadBtn5">← Nazad</button></div>';
  showOverlay(h);
  for (const b of document.querySelectorAll(".tez button"))
    b.onclick = () => { cilj = +b.dataset.c; sobaCilj = cilj; rekordi.izbor = { tez, cilj }; upisi(); window.SFX && SFX.tap(); pocetak(); };
  $("#nazadBtn5").onclick = pocetak;
}
function pauza() {
  if (rezim !== "sam" && stanje === "igra") {   // u sobi se partija ne zaustavlja zbog jednog
    javi("U sobi nema pauze — igra ide dalje.");
    return;
  }
  if (stanje === "igra") {
    stanje = "pauza";
    showOverlay('<h2>⏸ Pauza</h2><p>Teren: <b style="color:#eef2f9">' + Math.round(ja.pr) + '%</b></p>' +
      '<div class="btns"><button id="nastBtn">▶ Nastavi</button><button id="meniBtn2">← Meni</button></div>');
    $("#nastBtn").onclick = pauza;
    $("#meniBtn2").onclick = () => { if (rezim !== "sam") sobaKraj(); pocetak(); };
  } else if (stanje === "pauza") { stanje = "igra"; lastTs = 0; hideOverlay(); }
}

/* ---------- igra u sobi (do četiri igrača) ----------
   Domaćin vodi partiju: on jedini sudi (ko koga preseca, ko šta zauzima, gde padaju
   dragulji) i desetak puta u sekundi šalje kratak snimak — gde je čija glava. Gosti
   crtaju taj snimak, a svoju glavu vode i sami, da tipke rade odmah bez čekanja na
   mrežu; kad domaćin javi zauzimanje, smrt ili dragulj, to važi. */
let rezim = "sam";                             // sam | domacin | gost
let postava = null;                            // [{id, ime}] — ko igra kojom bojom
let cekaonica = false, ponoviVezu = null, tajmerStanja = null;
let sobaTez = "srednje", sobaCilj = 40;

function sobaSalji(m) { if (rezim === "domacin" && window.Mreza) Mreza.posalji(m); }
function ocistiTrag(e) {
  for (const i of e.trag) if (tragV[i] === e.id) tragV[i] = 0;
  e.trag.length = 0; e.dom = null; e.meta = null;
}
function imeMesta(i) {
  const e = igraci[i];
  return e ? imeIgraca(e) : "igrač";
}

function sobaMeni() {
  stanje = "meni";
  showOverlay('<h2>🌐 Igra u sobi</h2>' +
    '<p>Do <b>četiri igrača</b> na istoj tabli, svako na svom telefonu. Vidite se, možete ' +
    'jedan drugom preseći trag, a prazna mesta popune protivnici iz igre.</p>' +
    '<div class="btns"><button id="sobaBtn">🌐 Napravi sobu</button>' +
    '<button id="udjiBtn">🔗 Uđi u sobu</button>' +
    '<button id="nazadSoba">← Nazad</button></div>');
  $("#sobaBtn").onclick = () => napraviSobu();
  $("#udjiBtn").onclick = udjiUSobu;
  $("#nazadSoba").onclick = () => { sobaKraj(); pocetak(); };
}
function sobaKraj() {
  if (tajmerStanja) clearInterval(tajmerStanja);
  tajmerStanja = null; rezim = "sam"; postava = null; cekaonica = false; ponoviVezu = null;
  try { if (window.Mreza) Mreza.zatvori(); } catch (e) { }
  try { if (window.CET) CET.iskljuci(); } catch (e) { }
  hud();
}
function napraviSobu() {
  if (!Mreza.podrzana()) {
    showOverlay('<h2>Nije podržano</h2><p>Ovaj pregledač ne ume vezu sa drugim telefonom.</p><button id="nb">← Nazad</button>');
    $("#nb").onclick = sobaMeni; return;
  }
  rezim = "domacin"; ponoviVezu = napraviSobu;
  showOverlay('<h2>Pravim sobu…</h2><p>Spajam se na server za upoznavanje igrača.</p>');
  Mreza.napravi({ poruka: sobaPrimi, status: sobaStatus }).catch(() => { });
}
function udjiUSobu() {
  showOverlay('<h2>Uđi u sobu</h2><p>Ukucaj kod koji ti je poslao domaćin.</p>' +
    '<input id="kodIn" maxlength="5" placeholder="KOD" autocapitalize="characters" autocomplete="off" ' +
    'style="font:inherit;color:#eef2f9;background:#1b2a4a;border:1px solid #283a5e;border-radius:10px;padding:9px 11px;width:190px;text-align:center;letter-spacing:5px;text-transform:uppercase">' +
    '<div class="btns"><button id="idiBtn">🔗 Poveži se</button><button id="nazadBtn3">← Nazad</button></div>');
  $("#nazadBtn3").onclick = sobaMeni;
  $("#idiBtn").onclick = () => {
    const k = ($("#kodIn").value || "").trim().toUpperCase();
    if (k.length < 4) return;
    rezim = "gost";
    ponoviVezu = () => { udjiUSobu(); setTimeout(() => { const i = $("#kodIn"); if (i) i.value = k; }, 50); };
    showOverlay('<h2>Spajam se…</h2><p>Tražim sobu <b style="color:#c9a227">' + k + '</b></p>');
    Mreza.pridruzi(k, { poruka: sobaPrimi, status: sobaStatus }).catch(() => { });
  };
  setTimeout(() => { const i = $("#kodIn"); if (i) i.focus(); }, 100);
}
function sobaStatus(st, detalj) {
  if (st === "spajam") showOverlay('<h2>Spajam se…</h2><p>' + (detalj || "Tražim server…") + '</p>');
  if (st === "cekam") { cekaonica = true; pokaziKod(detalj); }
  if (st === "ucesnici") {
    if (cekaonica) pokaziKod(Mreza.kod());
    else if (rezim === "domacin" && postava) {          // ko je ispao, njegovu boju preuzima računar
      const ima = (Mreza.drustvo() || []).map(x => x.id);
      for (const e of igraci) if (!e.bot && e.mrezaId && e.mrezaId !== Mreza.jaSam() && ima.indexOf(e.mrezaId) < 0) {
        e.bot = true; e.brzina = TEZINE[tez].brzina;
      }
    }
    return;
  }
  if (st === "povezan") {
    window.CET && CET.ukljuci({ mreza: Mreza, ime: id => imeIz(id) });
    cekaonica = true; pokaziKod(Mreza.kod());
  }
  if (st === "prekinuto") {
    if (rezim === "gost") {
      if (stanje === "igra") stanje = "pauza";
      showOverlay('<h2>⚠️ Veza je prekinuta</h2><p>Domaćin je izašao ili nema signala.</p><button id="nbp">← Meni</button>');
      $("#nbp").onclick = () => { sobaKraj(); pocetak(); };
    } else javi("⚠️ Neko je izgubio vezu.");
  }
  if (st === "greska") {
    showOverlay('<h2>Spajanje nije uspelo</h2><p>' + (detalj || "") + '</p>' +
      '<div class="btns">' + (ponoviVezu ? '<button id="opetBtn2">↻ Probaj ponovo</button>' : '') +
      '<button id="nazadBtn4">← Nazad</button></div>');
    if (ponoviVezu) $("#opetBtn2").onclick = () => { const f = ponoviVezu; Mreza.zatvori(); f(); };
    $("#nazadBtn4").onclick = () => { sobaKraj(); sobaMeni(); };
  }
}
function imeIz(id) {
  if (postava) { const x = postava.find(p => p.id === id); if (x && x.ime) return x.ime; }
  const d = (window.Mreza && Mreza.drustvo() || []).find(p => p.id === id);
  return (d && d.ime) || "igrač";
}
function pokaziKod(kod) {
  stanje = "meni";
  const jeDomacin = rezim === "domacin";
  const svi = (Mreza.drustvo() || []).slice(0, 4);
  const red = svi.map((x, i) =>
    '<div class="mesto"><i style="background:' + BOJE[i].p + '"></i>' +
    (x.ime || (x.ja ? "ti (bez imena)" : "igrač bez imena")) + (x.ja ? ' <small>— ti</small>' : '') + '</div>').join("");
  showOverlay('<h2>Kod sobe</h2>' +
    '<div style="font-size:30px;font-weight:700;letter-spacing:8px;color:#c9a227;background:#16223a;' +
    'border:1px solid #283a5e;border-radius:12px;padding:10px 16px">' + kod + '</div>' +
    '<div class="mesta">' + red + (svi.length < 4 ? '<div class="mesto prazno">+ ima mesta do četiri igrača</div>' : '') + '</div>' +
    (jeDomacin
      ? '<p>Težina: <b style="color:#eef2f9">' + TEZINE[sobaTez].nm + '</b> · cilj: <b style="color:#eef2f9">' + sobaCilj + '%</b></p>'
      : '<p>Čekamo da domaćin krene…</p>') +
    '<div class="btns">' +
    (jeDomacin ? '<button id="tezSoba">⚙︎ Težina</button><button id="ciljSoba">🎯 Cilj</button>' : '') +
    (jeDomacin && svi.length >= 2 ? '<button id="kreniBtn">▶ Kreni (' + svi.length + ')</button>' : '') +
    '<button id="odustBtn">Odustani</button></div>' +
    ((window.IGRAC && !IGRAC.ime()) ? '<p><button id="imeBtn2">👤 Upiši svoje ime</button></p>' : ''));
  const kb = $("#kreniBtn"); if (kb) kb.onclick = kreniUSobi;
  const tb = $("#tezSoba"); if (tb) tb.onclick = () => {
    const red2 = ["lako", "srednje", "tesko"];
    sobaTez = red2[(red2.indexOf(sobaTez) + 1) % red2.length];
    pokaziKod(kod);
  };
  const cb = $("#ciljSoba"); if (cb) cb.onclick = () => {
    sobaCilj = CILJEVI[(CILJEVI.indexOf(sobaCilj) + 1) % CILJEVI.length];
    pokaziKod(kod);
  };
  const ib = $("#imeBtn2"); if (ib) ib.onclick = () => IGRAC.pitaj(() => pokaziKod(kod));
  $("#odustBtn").onclick = () => { sobaKraj(); pocetak(); };
}
function kreniUSobi() {                        // samo domaćin
  const svi = (Mreza.drustvo() || []).slice(0, 4).map((x, i) => ({ id: x.id, ime: x.ime || ("Igrač " + (i + 1)) }));
  if (svi.length < 2) return;
  const seme = (Math.random() * 2 ** 31) | 0;
  postava = svi; cekaonica = false;
  Mreza.posalji({ t: "P", ig: svi, seme, tez: sobaTez, cilj: sobaCilj });
  nova(seme, sobaTez, svi, sobaCilj);
  if (tajmerStanja) clearInterval(tajmerStanja);
  tajmerStanja = setInterval(posaljiStanje, 110);
}
function posaljiStanje() {
  if (rezim !== "domacin" || !igraci.length || stanje !== "igra") return;
  Mreza.posalji({
    t: "S", vr: Math.round(vreme * 10) / 10,
    e: igraci.map(e => [e.x, e.y, e.dx, e.dy, Math.round(e.p * 100) / 100, e.ziv ? 1 : 0,
      Math.round(e.stit * 10) / 10, Math.round(e.brzo * 10) / 10, Math.round(e.usporen * 10) / 10,
      Math.round(e.pr * 10) / 10]),
    b: bonusi.map(b => [b.v, b.x, b.y])
  });
}
function primiStanje(m) {
  if (!igraci.length || !m.e) return;
  vreme = m.vr || vreme;
  m.e.forEach((a, i) => {
    const e = igraci[i];
    if (!e) return;
    const [x, y, dx, dy, pp, ziv, stit, brzo, usporen, pr] = a;
    if (e === ja) {                              // svoju glavu vodim sam; poravnam se tek kad odlutam
      if (Math.abs(e.x - x) + Math.abs(e.y - y) > 3 || e.ziv !== !!ziv) { e.x = x; e.y = y; e.dx = dx; e.dy = dy; e.p = pp; }
    } else { e.x = x; e.y = y; e.dx = dx; e.dy = dy; e.p = pp; }
    e.stit = stit; e.brzo = brzo; e.usporen = usporen; e.pr = pr;
    if (!ziv && e.ziv) { ocistiTrag(e); e.ziv = false; }
    if (ziv && !e.ziv) { e.ziv = true; }
  });
  bonusi = (m.b || []).map(b => ({ v: b[0], x: b[1], y: b[2] }));
}
function korakGost(dt) {                       // gost samo pomera glave; pravila sudi domaćin
  if (priprema > 0) { priprema -= dt; return; }
  vreme += dt;
  for (const e of igraci) {
    if (!e.ziv) continue;
    if (e.stit > 0) e.stit = Math.max(0, e.stit - dt);
    if (e.brzo > 0) e.brzo = Math.max(0, e.brzo - dt);
    if (e.usporen > 0) e.usporen = Math.max(0, e.usporen - dt);
    e.p += brzinaOd(e) * dt;
    let z = 0;
    while (e.p >= 1 && z++ < 4) { e.p -= 1; napredGost(e); }
  }
}
function napredGost(e) {
  if (e.sled && !(e.sled.dx === -e.dx && e.sled.dy === -e.dy)) { e.dx = e.sled.dx; e.dy = e.sled.dy; }
  e.sled = null;
  const nx = e.x + e.dx, ny = e.y + e.dy;
  if (nx < 0 || ny < 0 || nx >= KOL || ny >= RED) return;
  e.x = nx; e.y = ny;
  const i = idx(nx, ny);
  if (vlas[i] === e.id) { if (e.trag.length) ocistiTrag(e); }     // zauzimanje potvrđuje domaćin
  else { tragV[i] = e.id; e.trag.push(i); }
}
function krajUSobi(pobeda, razlog, pobednik) {
  const w = pobednik ? igraci.indexOf(pobednik) : -1;
  if (rezim === "domacin") Mreza.posalji({ t: "K", w, pr: igraci.map(e => Math.round(e.pr * 10) / 10) });
  pokaziKrajSobe(w, igraci.map(e => e.pr));
}
function pokaziKrajSobe(w, prs) {
  stanje = "kraj";
  if (tajmerStanja) { clearInterval(tajmerStanja); tajmerStanja = null; }
  const jaPobedio = w === mojIndex;
  window.SFX && (jaPobedio ? SFX.jackpot() : SFX.siren());
  const red = igraci.map((e, i) => ({ e, i, pr: prs[i] || 0 })).sort((a, b) => b.pr - a.pr)
    .map(x => '<span><i style="background:' + x.e.boja.p + '"></i>' + imeIgraca(x.e) + (x.i === mojIndex ? " (ti)" : "") +
      '</span><b>' + (x.pr).toFixed(1) + '%</b>').join("");
  showOverlay('<h2>' + (w < 0 ? "Kraj partije" : jaPobedio ? "🏆 Pobedio si!" : "🏁 Pobedio je " + imeMesta(w)) + '</h2>' +
    '<p>Cilj je bio <b style="color:#eef2f9">' + cilj + '%</b> table.</p>' +
    '<div class="res">' + red + '</div>' +
    '<div class="btns">' +
    (rezim === "domacin" ? '<button id="opetSoba">▶ Nova runda</button>' : '') +
    '<button id="izlazSoba">✖ Izađi iz sobe</button></div>' +
    (rezim === "domacin" ? "" : '<p>Domaćin sprema sledeću rundu…</p>'));
  const ob = $("#opetSoba"); if (ob) ob.onclick = () => { cekaonica = true; pokaziKod(Mreza.kod()); };
  $("#izlazSoba").onclick = () => { sobaKraj(); pocetak(); };
}
function sobaPrimi(m, od) {
  if (window.CET && CET.primi(m, od)) return;
  if (!m || !m.t) return;
  if (rezim === "gost") {
    if (m.t === "P") {
      if (!m.ig || !m.ig.some(l => l.id === Mreza.jaSam())) {
        showOverlay('<h2>Soba je puna</h2><p>Partija je počela sa četvoro igrača. Sačekaj sledeću rundu ' +
          'ili napravite drugu sobu.</p><button id="punaBtn">← Meni</button>');
        $("#punaBtn").onclick = () => { sobaKraj(); pocetak(); };
        return;
      }
      postava = m.ig; cekaonica = false;
      nova(m.seme, m.tez, m.ig, m.cilj);
      if (tajmerStanja) { clearInterval(tajmerStanja); tajmerStanja = null; }
      return;
    }
    if (!igraci.length) return;
    if (m.t === "S") return primiStanje(m);
    if (m.t === "Z") { const e = igraci[m.i]; if (e) zauzmiPolja(e, m.c); return; }
    if (m.t === "X") {
      const e = igraci[m.i]; if (!e) return;
      ocistiTrag(e); e.ziv = false; e.stit = 0; e.brzo = 0;
      for (let i = 0; i < POLJA; i++) if (vlas[i] === e.id) vlas[i] = 0;
      prljav = true; prebroj(); hud();
      if (e === ja) { window.SFX && SFX.siren(); javi("💥 Oboren si — teren ti je propao."); }
      else if (igraci[m.k] === ja) { window.SFX && SFX.good(); javi("🎯 Oborio si " + imeIgraca(e) + "!"); }
      return;
    }
    if (m.t === "O") { const e = igraci[m.i]; if (e) ozivinaMestu(e, m.x, m.y); return; }
    if (m.t === "B") { const e = igraci[m.i]; if (e) uzmiBonus(e, m.v); return; }
    if (m.t === "K") return pokaziKrajSobe(m.w, m.pr || []);
    return;
  }
  if (rezim === "domacin" && m.t === "D") {      // gost je promenio smer
    const e = igraci.find(x => x.mrezaId === od);
    if (e && e.ziv && SMER[m.d]) usmeri(e, SMER[m.d].dx, SMER[m.d].dy);
  }
}

/* ---------- ulaz ---------- */
const SMER = { l: { dx: -1, dy: 0 }, r: { dx: 1, dy: 0 }, u: { dx: 0, dy: -1 }, d: { dx: 0, dy: 1 } };
function vozi(k) {
  if (stanje !== "igra" || !ja || !ja.ziv) return;
  const s = SMER[k];
  if (!s || !usmeri(ja, s.dx, s.dy)) return;
  window.SFX && SFX.tick();
  if (rezim === "gost" && window.Mreza) Mreza.posalji({ t: "D", d: k });
}
for (const b of document.querySelectorAll(".tipke button"))
  b.addEventListener("click", () => vozi(b.dataset.s));

let poc = null;
cv.addEventListener("pointerdown", e => {
  if (stanje !== "igra") return;
  cv.setPointerCapture(e.pointerId);
  poc = { x: e.clientX, y: e.clientY };
});
cv.addEventListener("pointermove", e => {
  if (!poc || stanje !== "igra") return;
  const dx = e.clientX - poc.x, dy = e.clientY - poc.y;
  const prag = 14;
  if (Math.abs(dx) < prag && Math.abs(dy) < prag) return;
  vozi(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u"));
  poc = { x: e.clientX, y: e.clientY };            // prevlačenje dalje odmah menja smer
});
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) cv.addEventListener(ev, () => poc = null);

document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a") { vozi("l"); e.preventDefault(); }
  else if (k === "ArrowRight" || k === "d") { vozi("r"); e.preventDefault(); }
  else if (k === "ArrowUp" || k === "w") { vozi("u"); e.preventDefault(); }
  else if (k === "ArrowDown" || k === "s") { vozi("d"); e.preventDefault(); }
  else if (k === "p" || k === "P") pauza();
});
$("#bPause").onclick = pauza;
$("#theme").onclick = () => {
  const b = document.body;
  b.dataset.theme = b.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, b.dataset.theme); } catch (e) { }
};
document.addEventListener("visibilitychange", () => { if (document.hidden && stanje === "igra") pauza(); });

/* ---------- petlja i veličina ---------- */
function loop(ts) {
  raf = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(.05, (ts - lastTs) / 1000); lastTs = ts;
  if (stanje === "igra") {
    if (rezim === "gost") korakGost(dt); else korak(dt);
    if (ts - hudTs > 250) { hudTs = ts; hud(); }
  }
  pomeriKameru(stanje === "igra" && priprema <= 0 ? dt : 0);
  crtaj();
}
function fit() {
  const wrap = document.querySelector(".wrap"), nav = document.querySelector(".gamenav"), stage = document.querySelector(".stage");
  const limit = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  const kids = [...wrap.children].filter(el => el.offsetParent !== null);
  const others = kids.filter(el => el !== stage).reduce((a, el) => a + el.getBoundingClientRect().height, 0);
  const cs = getComputedStyle(wrap);
  const gaps = (parseFloat(cs.rowGap) || 0) * Math.max(0, kids.length - 1);
  const availH = limit - wrap.getBoundingClientRect().top - others - gaps - (parseFloat(cs.paddingBottom) || 0) - 12;
  const availW = Math.min(window.innerWidth - 20, 460);
  const w = Math.max(150, Math.floor(availW));
  const h = Math.max(200, Math.floor(availH));
  cv.style.width = w + "px"; cv.style.height = h + "px";
  /* Platno mora da ima onoliko pravih piksela koliko ga ekran zaista crta —
     inače je slika mutna na gustim ekranima. */
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  PPC = Math.max(5, Math.round(cv.width / VID_KOL));       // pravih piksela po ćeliji
  vidW = Math.min(KOL, cv.width / PPC);
  vidH = Math.min(RED, cv.height / PPC);
  const c = ciljKamere(); kam.x = c.x; kam.y = c.y;
  prljav = true;
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 150));
window.addEventListener("load", fit);

/* ---------- start ---------- */
try { const t = localStorage.getItem(THEME_KEY); if (t) document.body.dataset.theme = t; } catch (e) { }
ucitaj();
if (rekordi.izbor) {            // vraća se ono što si poslednji put izabrao
  if (TEZINE[rekordi.izbor.tez]) tez = rekordi.izbor.tez;
  if (CILJEVI.indexOf(rekordi.izbor.cilj) >= 0) cilj = rekordi.izbor.cilj;
  sobaTez = tez; sobaCilj = cilj;
}
nova(1, tez);                   // tabla se vidi iza menija
stanje = "meni";
fit(); crtaj(); pocetak();
raf = requestAnimationFrame(loop);

window.T = {
  KOL, RED, POLJA, TEZINE, BOJE, VID_KOL,
  get PPC() { return PPC; }, get vidW() { return vidW; }, get vidH() { return vidH; }, get kam() { return kam; },
  ciljKamere, pomeriKameru,
  get stanje() { return stanje; }, set stanje(v) { stanje = v; },
  get igraci() { return igraci; }, get ja() { return ja; }, get vlas() { return vlas; },
  get trag() { return tragV; }, get cilj() { return cilj; }, get tez() { return tez; },
  get vreme() { return vreme; }, get rekordi() { return rekordi; },
  get rezim() { return rezim; }, get postava() { return postava; }, get bonusi() { return bonusi; },
  get mojIndex() { return mojIndex; }, BONUS, CILJEVI, set cilj(v) { cilj = v; },
  spustiBonus, uzmiBonus, sobaMeni, sobaKraj, kreniUSobi, korakGost, izborCilja,
  idx, nova, korak, napred, zauzmi, pogini, ozivi, prebroj, botOdluka, usmeri, vozi,
  zauzmiPreko: (e, c) => { sobaSalji({ t: "Z", i: igraci.indexOf(e), c }); zauzmiPolja(e, c); },
  get priprema() { return priprema; }, set priprema(v) { priprema = v; },
  pocetak, izborTezine, pauza, hud, kraj,
  vrti: (dt, n) => { for (let i = 0; i < n; i++) korak(dt); },
  postavi: (e, x, y, dx, dy) => { e.x = x; e.y = y; e.dx = dx; e.dy = dy; e.p = 0; }
};
